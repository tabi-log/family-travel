<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>家族旅行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&family=Source+Code+Pro:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap">
<style>
/* 新版外觀：左右分割大圖＋主色色塊、襯線大標、打字機感等寬內文、膠囊按鈕
   字體全部用 Adobe「思源」同一家族：中文標題思源宋體、中文內文思源黑體，
   英文標題 Source Serif 4（思源宋體的英文本家）、英數字標籤 Source Code Pro（思源黑體的等寬版） */
:root{
  color-scheme:light;
  --bg:#FBF5EA; --paper:#FFFDF8; --butter:#FCDA93; --butter-2:#F8E7BF; --line:#E3D6BE;
  --ink:#3A2A25; --mute:#7A6A60; --soft:#A39588;
  --sage:#7E8C6A; --sage-soft:#E6EADB; --rust:#B4583A; --rust-soft:#F7E1D5;
  --f-display:"Source Serif 4","Noto Serif TC","Source Han Serif TC","思源宋體",serif;
  --f-serif:"Noto Serif TC","Source Han Serif TC","思源宋體",serif;
  --f-mono:"Source Code Pro","Noto Sans TC","Source Han Sans TC","思源黑體",monospace;
  --f-sans:"Noto Sans TC","Source Han Sans TC","思源黑體","PingFang TC","Microsoft JhengHei",sans-serif;
  --gut:max(16px,env(safe-area-inset-left,0px));
  --navh:76px;
}
/* 紅磚陶土：取自閩南紅磚、鳥居朱紅、燈籠的暖色 */
:root[data-palette="clay"]{
  --bg:#FAF4EF; --paper:#FFFCF9; --butter:#E8B79E; --butter-2:#F5DDD0; --line:#E6D3C6;
  --ink:#3B2622; --mute:#7E6560; --soft:#A89089; --sage:#9A6B57; --rust:#A8432C; --rust-soft:#F6DED3;
}
/* 抹茶苔綠：取自京都寺院庭園、植物園的綠意 */
:root[data-palette="matcha"]{
  --bg:#F7F6EF; --paper:#FFFFFB; --butter:#C9D3AE; --butter-2:#E4E9D3; --line:#DCDDCB;
  --ink:#2C3324; --mute:#646B58; --soft:#959A86; --sage:#6F7F55; --rust:#A4552F; --rust-soft:#F2E0D3; --sage-soft:#E4E9D3;
}
/* 燕麥奶茶：低彩度的米杏色，最安靜、最襯照片 */
:root[data-palette="latte"]{
  --bg:#F8F5F0; --paper:#FFFFFF; --butter:#E3D3BD; --butter-2:#EFE6D9; --line:#E2D8CA;
  --ink:#34291F; --mute:#76695D; --soft:#A2968A; --sage:#8F7B66; --rust:#9C5A3C; --rust-soft:#F1E1D6;
}
/* 暮色紫灰：取自傍晚天空與夜景燈光的紫灰 */
:root[data-palette="dusk"]{
  --bg:#F6F4F5; --paper:#FFFFFF; --butter:#D5CCDB; --butter-2:#E8E2EB; --line:#DDD7DD;
  --ink:#2B2533; --mute:#665E6E; --soft:#9A92A0; --sage:#6E6380; --rust:#B0563F; --rust-soft:#F3E0DA; --sage-soft:#E8E2EB;
}
/* 海霧藍：取自港口、海面與傍晚天空的藍灰 */
:root[data-palette="sea"]{
  --bg:#F5F5F1; --paper:#FFFFFF; --butter:#C6D6DC; --butter-2:#E1EAEC; --line:#D5DCDC;
  --ink:#1F2E3A; --mute:#5E6B74; --soft:#8E9AA2; --sage:#5F7C8A; --rust:#B9603F; --rust-soft:#F4E2D9; --sage-soft:#E1EAEC;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:500;line-height:1.15;text-wrap:balance}
p{margin:0}
a{color:inherit}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
a:focus-visible,button:focus-visible{outline:2px solid var(--rust);outline-offset:3px;border-radius:999px}
.wrap{max-width:1240px;margin:0 auto;padding-left:var(--gut);padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono)}
.kicker{font-family:var(--f-mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.sec{padding-block:clamp(64px,10vw,128px)}
.sec-h{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:16px 40px;margin-bottom:clamp(36px,5vw,64px);border-bottom:1px solid var(--ink);padding-bottom:20px}
.sec-h h2{font-size:clamp(36px,6vw,72px);margin-top:6px;letter-spacing:-.01em}
.sec-h p{font-family:var(--f-mono);font-size:14px;color:var(--mute);max-width:30em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:10px 26px;border-radius:999px;background:var(--ink);color:var(--butter);text-decoration:none;font-family:var(--f-mono);font-size:15px;letter-spacing:.06em;border:1.5px solid var(--ink);white-space:nowrap;transition:background .2s,color .2s}
.btn:hover{background:transparent;color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--butter)}
.more{display:inline-flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:14px;letter-spacing:.06em;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:2px}
.more::after{content:"→";transition:transform .2s}
a:hover .more::after,.more:hover::after{transform:translateX(4px)}
.noimg{width:100%;height:100%;min-height:120px;display:flex;align-items:center;justify-content:center;background:var(--sage);color:var(--butter);font-family:var(--f-display);font-style:italic;font-size:clamp(22px,3.4vw,40px);letter-spacing:.06em;text-align:center;padding:16px}
.warn{display:inline-block;font-family:var(--f-mono);font-size:12px;padding:0 8px;border-radius:999px;background:var(--rust-soft);color:var(--rust);margin-right:2px}
.okk{display:inline-block;font-family:var(--f-mono);font-size:12px;padding:0 8px;border-radius:999px;background:var(--sage-soft);color:#56633F;margin-right:2px}

/* 頁首：襯線 logo＋外框膠囊選單 */
.nav{position:fixed;inset:0 0 auto;z-index:50;padding-top:env(safe-area-inset-top,0px);transition:background .3s,box-shadow .3s}
.nav.solid{background:color-mix(in srgb,var(--bg) 94%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 1px 0 var(--line)}
.page{padding-top:calc(var(--navh) + env(safe-area-inset-top,0px))}
.nav .wrap{height:var(--navh);display:flex;align-items:center;gap:16px;max-width:none;padding-left:max(24px,var(--gut));padding-right:max(24px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:baseline;gap:12px;text-decoration:none;font-family:var(--f-serif);font-weight:900;font-size:26px;letter-spacing:.06em;white-space:nowrap;background:var(--bg);padding:2px 18px 4px;border-radius:999px;transition:background .3s}
.nav.solid .logo{background:transparent;padding-left:0}
.logo small{font-family:var(--f-display);font-style:italic;font-weight:400;font-size:20px;letter-spacing:0}
.menu{margin-left:auto;display:flex;gap:8px;align-items:center}
.menu a{padding:5px 18px;text-decoration:none;font-family:var(--f-mono);font-size:15px;border:1.2px solid var(--ink);border-radius:999px;background:var(--butter);transition:background .2s,color .2s;white-space:nowrap}
.menu a:hover,.menu a[aria-current]{background:var(--ink);color:var(--butter)}
.menu a.cta{background:var(--ink);color:var(--butter);margin-left:8px}
.menu a.cta:hover{background:transparent;color:var(--ink)}
.burger{display:none;margin-left:auto;background:var(--butter);border:1.2px solid var(--ink);border-radius:999px;padding:6px 16px;font-family:var(--f-mono);font-size:14px;gap:8px;align-items:center}
.drawer{position:fixed;inset:0;z-index:60;background:var(--butter);color:var(--ink);padding:calc(env(safe-area-inset-top,0px) + 18px) 24px 40px;display:flex;flex-direction:column;overflow-y:auto}
.drawer .x{align-self:flex-end;background:none;border:1.2px solid var(--ink);border-radius:999px;padding:6px 16px;font-family:var(--f-mono);font-size:14px}
.drawer nav{margin-top:32px;display:flex;flex-direction:column}
.drawer nav a{padding:18px 0;border-bottom:1px solid color-mix(in srgb,var(--ink) 25%,transparent);text-decoration:none;font-family:var(--f-display);font-size:34px;line-height:1.2;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.drawer nav a small{font-family:var(--f-mono);font-size:13px;color:var(--mute)}

/* 分割大圖：左照片、右奶油黃色塊 */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:max(640px,100svh);background:var(--butter)}
.split.short{min-height:clamp(560px,82svh,820px)}
.split .ph{position:relative;margin:0;overflow:hidden;background:var(--sage)}
.split .ph img,.split .ph .noimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.split .ph img{animation:zoom 14s ease-out both}
@keyframes zoom{from{transform:scale(1.06)}to{transform:scale(1)}}
.split .ph figcaption{position:absolute;left:20px;bottom:16px;font-family:var(--f-mono);font-size:12px;color:#fff;background:color-mix(in srgb,var(--ink) 55%,transparent);padding:3px 12px;border-radius:999px}
.split .panel{position:relative;display:flex;flex-direction:column;justify-content:center;padding:calc(var(--navh) + clamp(32px,5vw,72px)) clamp(24px,4vw,64px) clamp(40px,5vw,72px)}
.split h1{font-size:clamp(44px,6.4vw,100px);line-height:1.05;letter-spacing:-.015em;font-weight:400}
.split h1 .zh{display:block;font-family:var(--f-serif);font-weight:900;letter-spacing:.04em;font-size:.82em;margin-top:.12em}
.split h1 .en{display:block}
.split .lead{font-family:var(--f-mono);font-size:clamp(15px,1.4vw,18px);line-height:1.75;margin-top:clamp(24px,3vw,40px);max-width:30em}
.split .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.split .meta span{font-family:var(--f-mono);font-size:14px;border:1.2px solid var(--ink);border-radius:999px;padding:3px 14px}
.split .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:clamp(28px,3vw,40px)}
.split .inset{position:absolute;right:clamp(24px,4vw,64px);bottom:0;width:clamp(150px,17vw,260px);aspect-ratio:3/4;margin:0;overflow:hidden}
.split .inset img{width:100%;height:100%;object-fit:cover}
.split.has-inset .panel{padding-bottom:clamp(220px,26vw,400px)}

/* 數字列 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--ink)}
.stats div{padding:clamp(24px,3vw,40px) 12px;text-align:center}
.stats div+div{border-left:1px solid var(--ink)}
.stats b{display:block;font-family:var(--f-display);font-size:clamp(44px,6vw,80px);font-weight:400;line-height:1}
.stats span{font-family:var(--f-mono);font-size:14px;color:var(--mute)}

/* 介紹區：半版圖＋半版文字 */
.intro{display:grid;grid-template-columns:1fr 1fr;background:var(--paper)}
.intro .im{position:relative;min-height:clamp(420px,52vw,760px);overflow:hidden}
.intro .im img,.intro .im .noimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.intro .tx{padding:clamp(48px,7vw,112px) clamp(24px,5vw,80px);display:flex;flex-direction:column;justify-content:center}
.intro h2{font-size:clamp(40px,5.4vw,76px);margin-top:14px;letter-spacing:-.01em}
.intro h2 .zh{display:block;font-family:var(--f-serif);font-weight:700;font-size:.56em;margin-top:.3em;letter-spacing:.04em}
.intro p.body{font-family:var(--f-mono);color:var(--mute);margin-top:28px;font-size:15px;max-width:32em}
.intro ul{list-style:none;padding:0;margin:28px 0 34px;border-top:1px solid var(--line);max-width:34em}
.intro li{display:flex;gap:18px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.intro li b{font-family:var(--f-display);font-weight:500;font-size:20px;min-width:3.6em}
.intro .btn{align-self:flex-start}

/* 旅程卡片：三聯拼貼封面、宋體粗標題、字距拉開的灰色資訊、Read more 連結 */
.trips{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(36px,4vw,56px) clamp(20px,3vw,36px)}
.trip{display:flex;flex-direction:column;text-decoration:none}
.trip .ph{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:10px;background:var(--sage)}
.trip .ph>img,.trip .ph>.noimg{width:100%;height:100%;object-fit:cover}
.trip .tri{display:grid;grid-template-columns:repeat(3,1fr);height:100%}
.trip .tri img{width:100%;height:100%;object-fit:cover;transition:transform .7s}
.trip:hover .tri img{transform:scale(1.06)}
.trip .code{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-family:var(--f-display);font-style:italic;font-size:clamp(18px,1.8vw,24px);color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.45);pointer-events:none}
.trip .badge{position:absolute;right:12px;top:12px;background:var(--ink);color:var(--butter);font-family:var(--f-mono);font-size:13px;padding:2px 14px;border-radius:999px}
.trip .cap{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:22px 4px 0}
.trip h3{font-family:var(--f-serif);font-weight:700;font-size:clamp(21px,2vw,25px);line-height:1.45;letter-spacing:.04em}
.trip h3 small{display:block;font-family:var(--f-serif);font-weight:500;font-size:15px;color:var(--mute);letter-spacing:.02em;margin-top:4px}
.trip .no{font-family:var(--f-display);font-size:clamp(44px,4.4vw,64px);line-height:.85;flex:none;color:var(--ink)}
.trip .tmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:14px 4px 0;font-family:var(--f-mono);font-size:13px;letter-spacing:.12em;color:var(--soft)}
.trip .tmeta span{display:inline-flex;align-items:center;gap:6px}
.trip .tmeta svg{width:15px;height:15px}
.trip .read{display:inline-flex;align-items:center;gap:8px;margin:18px 4px 0;font-family:var(--f-display);font-style:italic;font-size:17px;color:var(--rust);align-self:flex-start}
.trip .read svg{width:18px;height:18px;transition:transform .2s}
.trip:hover .read svg{transform:translateX(4px)}

/* 輪播語錄（旅行小叮嚀） */
.quote{background:var(--butter);text-align:center}
.quote .who{font-family:var(--f-mono);font-size:15px;letter-spacing:.24em}
.quote blockquote{margin:28px auto 0;max-width:24em;font-family:var(--f-serif);font-weight:500;font-size:clamp(24px,3.4vw,40px);line-height:1.55;min-height:3.2em;display:flex;align-items:center;justify-content:center}
.quote .ctl{display:flex;justify-content:space-between;align-items:center;max-width:820px;margin:36px auto 0}
.quote .ctl button{width:48px;height:48px;border-radius:50%;border:1.2px solid var(--ink);background:transparent;display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s}
.quote .ctl button:hover{background:var(--ink);color:var(--butter)}
.quote .ctl svg{width:20px;height:20px}
.quote .ctl span{font-family:var(--f-mono);font-size:13px;color:var(--mute)}
.quote h2{font-size:clamp(36px,5.4vw,68px);margin-bottom:clamp(36px,5vw,56px)}

/* 照片牆 */
.wall{columns:4 220px;column-gap:14px}
.wall button{display:block;width:100%;margin:0 0 14px;padding:0;border:0;overflow:hidden;break-inside:avoid;position:relative;background:var(--butter-2)}
.wall img{width:100%;height:auto;transition:transform .6s}
.wall button:hover img{transform:scale(1.05)}
.wall button span{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);background:var(--bg);font-family:var(--f-mono);font-size:12px;padding:2px 10px;border-radius:999px;text-align:left;opacity:0;transition:opacity .3s}
.wall button:hover span,.wall button:focus-visible span{opacity:1}

/* 頁尾 */
footer{background:var(--ink);color:var(--butter-2);padding:clamp(56px,8vw,96px) 0 calc(28px + env(safe-area-inset-bottom,0px))}
footer .big{font-family:var(--f-display);font-size:clamp(48px,9vw,128px);line-height:1;color:var(--butter);border-bottom:1px solid color-mix(in srgb,var(--butter) 30%,transparent);padding-bottom:28px;margin-bottom:36px}
footer .big i{font-weight:400}
footer .grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:32px}
footer p{font-family:var(--f-mono);font-size:14px;line-height:1.9}
footer h4{margin:0 0 12px;font-family:var(--f-mono);font-size:13px;letter-spacing:.18em;font-weight:400;opacity:.7}
footer nav{display:flex;flex-direction:column;gap:6px;font-size:15px}
footer nav a{text-decoration:none}
footer nav a:hover{text-decoration:underline}
footer .copy{border-top:1px solid color-mix(in srgb,var(--butter) 30%,transparent);margin-top:40px;padding-top:20px;font-family:var(--f-mono);font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;opacity:.7}

/* 旅程頁：資訊條 */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));background:var(--ink);color:var(--butter-2)}
.facts div{padding:24px clamp(20px,3vw,40px)}
.facts div+div{border-left:1px solid color-mix(in srgb,var(--butter) 25%,transparent)}
.facts small{display:block;font-family:var(--f-mono);font-size:13px;letter-spacing:.12em;opacity:.7}
.facts b{display:block;font-family:var(--f-serif);font-weight:700;font-size:18px;margin-top:4px;line-height:1.5;color:var(--butter)}

/* 每日（圖文交錯） */
.days{display:grid;gap:clamp(48px,8vw,112px)}
.dayrow{display:grid;grid-template-columns:1.15fr 1fr;gap:clamp(28px,5vw,80px);align-items:center}
.dayrow:nth-child(even) .ph{order:2}
.dayrow .ph{position:relative;aspect-ratio:4/3;overflow:hidden;display:block}
.dayrow .ph img,.dayrow .ph .noimg{width:100%;height:100%;object-fit:cover;transition:transform .7s}
.dayrow .ph:hover img{transform:scale(1.04)}
.dayrow .ph figcaption{position:absolute;left:14px;bottom:12px;font-family:var(--f-mono);font-size:12px;background:var(--bg);padding:2px 12px;border-radius:999px}
.dayrow .num{font-family:var(--f-display);font-size:clamp(64px,9vw,120px);font-weight:400;font-style:italic;line-height:.9;display:flex;align-items:baseline;gap:16px}
.dayrow .num small{font-family:var(--f-mono);font-style:normal;font-size:13px;letter-spacing:.12em;color:var(--mute)}
.dayrow h3{font-family:var(--f-serif);font-weight:700;font-size:clamp(26px,3.2vw,36px);margin-top:16px}
.dayrow .date{font-family:var(--f-mono);color:var(--mute);font-size:14px;margin-top:6px}
.dayrow ul{list-style:none;padding:0;margin:20px 0 26px;border-top:1px solid var(--line)}
.dayrow li{padding:10px 0 10px 26px;border-bottom:1px solid var(--line);position:relative;font-size:15px}
.dayrow li::before{content:"—";position:absolute;left:0;color:var(--soft)}
.dayrow .must{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.dayrow .must span{font-family:var(--f-mono);font-size:13px;background:var(--butter);padding:3px 14px;border-radius:999px}
.dayrow .must b{font-weight:500;margin-right:6px}

/* 重要時間 */
.band{background:var(--butter)}
.band .sec-h{border-color:var(--ink)}
.anchors{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));border-top:1px solid var(--ink)}
.anchor{display:flex;gap:20px;align-items:flex-start;padding:22px 8px;border-bottom:1px solid var(--ink);text-decoration:none;transition:background .2s}
.anchor:hover{background:var(--butter-2)}
.anchor .t{font-family:var(--f-display);font-size:40px;line-height:1;min-width:2.9em}
.anchor small{display:block;font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;color:var(--mute)}
.anchor p{font-size:15px;margin-top:2px}

/* 區域卡片 */
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:clamp(16px,2vw,24px)}
.areac{display:block;text-decoration:none}
.areac .im{aspect-ratio:3/4;overflow:hidden}
.areac img,.areac .noimg{width:100%;height:100%;object-fit:cover;transition:transform .7s}
.areac:hover img{transform:scale(1.05)}
.areac div.t{padding-top:14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:10px}
.areac h3{font-family:var(--f-serif);font-weight:700;font-size:22px}
.areac small{font-family:var(--f-mono);font-size:12px;color:var(--mute);white-space:nowrap}
.areac p{font-family:var(--f-mono);font-size:13px;color:var(--mute);margin-top:8px}

/* 實用資訊（摺疊） */
.acc{border-top:1px solid var(--ink)}
.acc details{border-bottom:1px solid var(--ink)}
.acc summary{list-style:none;cursor:pointer;padding:22px 4px;display:flex;justify-content:space-between;align-items:center;gap:16px;font-family:var(--f-serif);font-weight:700;font-size:clamp(18px,2vw,22px)}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";font-family:var(--f-mono);font-size:24px;transition:transform .25s;line-height:1;flex:none}
.acc details[open] summary::after{transform:rotate(45deg)}
.acc details p{padding:0 4px 24px;max-width:56em;font-size:15px}

/* 每日頁 */
.daytabs{position:sticky;top:calc(var(--navh) + env(safe-area-inset-top,0px));z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.daytabs nav{display:flex;gap:8px;overflow-x:auto;padding-block:12px;scrollbar-width:none}
.daytabs nav::-webkit-scrollbar{display:none}
.daytabs a{flex:none;text-decoration:none;padding:4px 16px;border-radius:999px;font-family:var(--f-mono);font-size:14px;border:1.2px solid var(--ink);white-space:nowrap}
.daytabs a b{font-weight:500;margin-right:6px}
.daytabs a[aria-current]{background:var(--ink);color:var(--butter)}
.dlayout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:clamp(32px,5vw,72px);align-items:start}
.tl{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.tl li{display:grid;grid-template-columns:110px 1fr;gap:20px;padding:18px 0;border-bottom:1px solid var(--line)}
.tl .t{font-family:var(--f-display);font-size:28px;line-height:1.1}
.tl .t small{display:block;font-family:var(--f-mono);font-size:12px;color:var(--mute);margin-top:4px}
.tl .x{padding-top:4px}
.tl .tag{display:inline-block;font-family:var(--f-mono);font-size:12px;padding:0 12px;border-radius:999px;margin-right:8px;border:1.2px solid var(--ink)}
.tl li.key{background:var(--butter);border-bottom-color:var(--ink);margin-inline:-12px;padding-inline:12px}
.tl li.key .tag{background:var(--ink);color:var(--butter)}
.tl li.move{padding:8px 0}
.tl li.move .x{font-family:var(--f-mono);font-size:13px;color:var(--mute);padding-top:0}
.tl li.move .x::before{content:"↓  ";color:var(--rust)}
.side{position:sticky;top:calc(var(--navh) + 80px);display:grid;gap:20px}
.box{background:var(--paper);border:1px solid var(--line);padding:26px 26px 28px}
.box h3{font-family:var(--f-serif);font-weight:700;font-size:22px;border-bottom:1px solid var(--ink);padding-bottom:12px}
.box .mustl{display:grid;gap:8px;margin-top:16px}
.box .mustl div{display:flex;gap:14px;background:var(--butter);border-radius:999px;padding:6px 18px;font-size:15px}
.box .mustl b{font-family:var(--f-mono);font-weight:500;flex:none}
.box ul{list-style:none;margin:14px 0 0;padding:0}
.box li{padding:8px 0 8px 24px;border-bottom:1px solid var(--line);position:relative;font-size:15px}
.box li::before{content:"—";position:absolute;left:0;color:var(--soft)}
.box .foot{margin-top:14px;font-family:var(--f-mono);font-size:13px;color:var(--mute)}
.legs{display:grid;margin-top:6px}
.legs div{border-bottom:1px solid var(--line);padding:12px 0}
.legs b{display:block;font-size:15px}
.legs span{font-family:var(--f-mono);font-size:13px;color:var(--rust)}
.legs p{font-size:14px;color:var(--mute)}
.pager{display:grid;grid-template-columns:1fr 1fr;margin-top:clamp(56px,8vw,96px);border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.pager a{display:block;padding:24px 8px;text-decoration:none;transition:background .2s}
.pager a:hover{background:var(--butter)}
.pager small{display:block;font-family:var(--f-mono);font-size:13px;color:var(--mute)}
.pager b{font-family:var(--f-serif);font-size:clamp(18px,2.2vw,24px)}
.pager .next{text-align:right;grid-column:2;border-left:1px solid var(--ink)}

/* 景點與店家 */
.pagehead{padding-top:clamp(40px,6vw,80px)}
.pagehead h1{font-size:clamp(44px,8vw,104px);margin-top:10px;letter-spacing:-.01em}
.pagehead h1 .zh{font-family:var(--f-serif);font-weight:900}
.pagehead p.lead{font-family:var(--f-mono);color:var(--mute);margin-top:16px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.chips a,.chips button{text-decoration:none;padding:4px 16px;border-radius:999px;border:1.2px solid var(--ink);background:transparent;font-family:var(--f-mono);font-size:14px}
.chips a span{margin-left:6px;color:var(--mute)}
.chips a:hover,.chips button[aria-pressed="true"]{background:var(--ink);color:var(--butter)}
.chips a:hover span{color:var(--butter)}
.area{margin-top:clamp(56px,8vw,104px);scroll-margin-top:calc(var(--navh) + 24px)}
.area-h{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);background:var(--butter);min-height:clamp(200px,24vw,300px)}
.area-h .im{overflow:hidden;position:relative}
.area-h .im img,.area-h .im .noimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.area-h div.t{padding:clamp(24px,3vw,40px);display:flex;flex-direction:column;justify-content:flex-end}
.area-h small{font-family:var(--f-mono);font-size:13px;color:var(--mute)}
.area-h h2{font-family:var(--f-serif);font-weight:900;font-size:clamp(32px,4.4vw,56px);margin-top:6px}
.area-h h2 span{font-family:var(--f-mono);font-size:14px;font-weight:400;margin-left:10px;color:var(--mute)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));border-top:1px solid var(--ink);margin-top:24px}
.pc{display:flex;flex-direction:column;gap:6px;padding:22px 20px 22px 0;text-decoration:none;border-bottom:1px solid var(--line);transition:background .2s}
.pc:hover{background:var(--butter-2)}
.pc .top{display:flex;gap:8px;align-items:center;font-family:var(--f-mono);font-size:12px}
.pc .top .k{padding:0 12px;border-radius:999px;border:1.2px solid var(--ink)}
.pc.eat .top .k{background:var(--ink);color:var(--butter)}
.pc .top .tg{color:var(--mute)}
.pc .top .rs{margin-left:auto;color:var(--rust)}
.pc h3{font-family:var(--f-serif);font-weight:700;font-size:20px}
.pc p{font-size:14px;color:var(--mute);line-height:1.75}

/* 地點詳情 */
.pd{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(28px,5vw,72px);align-items:end;border-bottom:1px solid var(--ink);padding-bottom:clamp(32px,4vw,48px)}
.pd h1{font-family:var(--f-serif);font-weight:900;font-size:clamp(36px,6vw,72px);line-height:1.15}
.pd .pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.pd .pills span{font-family:var(--f-mono);font-size:13px;padding:2px 14px;border-radius:999px;border:1.2px solid var(--ink)}
.pd .pills .ok{background:var(--ink);color:var(--butter)}
.pd .desc{font-size:17px;line-height:1.95}
.pd .btn{margin-top:24px}
.pphotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:14px;margin-top:clamp(36px,5vw,56px)}
.pphotos button{padding:0;border:0;aspect-ratio:4/5;overflow:hidden;background:var(--butter-2)}
.pphotos img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.pphotos button:hover img{transform:scale(1.05)}
.empty{font-family:var(--f-mono);color:var(--mute);padding:48px 16px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);text-align:center}

/* 燈箱 */
.lb{position:fixed;inset:0;z-index:80;background:rgba(35,25,22,.96);display:flex;align-items:center;justify-content:center;padding:64px 12px 76px}
.lb img{max-width:min(100%,1100px);max-height:100%;object-fit:contain}
.lb .cap{position:absolute;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--butter-2);font-family:var(--f-mono);font-size:13px;padding:0 64px}
.lb button{position:absolute;background:transparent;border:1.2px solid var(--butter);color:var(--butter);border-radius:999px;font-family:var(--f-mono);font-size:14px;padding:6px 16px;line-height:1.4}
.lb button:hover{background:var(--butter);color:var(--ink)}
.lb [data-lb="x"]{top:calc(14px + env(safe-area-inset-top,0px));right:14px}
.lb [data-lb="-1"]{left:14px;top:50%;transform:translateY(-50%)}
.lb [data-lb="1"]{right:14px;top:50%;transform:translateY(-50%)}

/* 手機底部分頁列 */
.tabbar{display:none}

@media (max-width:1080px){
  .menu a:not(.cta):not([aria-current]){display:none}
}
@media (max-width:860px){
  :root{--navh:64px}
  .menu{display:none}
  .burger{display:flex}
  .logo{font-size:22px}
  .logo small{font-size:17px}
  .split,.split.short{grid-template-columns:1fr;min-height:0}
  .split .ph{aspect-ratio:4/4.2}
  .split.short .ph{aspect-ratio:4/3.4}
  .split .panel{padding-top:clamp(36px,6vw,72px)}
  .intro{grid-template-columns:1fr}
  .intro .im{min-height:0;aspect-ratio:4/3}

  .split.has-inset .panel{padding-bottom:clamp(40px,6vw,88px)}
  .split .inset{display:none}
  .dayrow,.dlayout,.pd{grid-template-columns:1fr}
  .dayrow:nth-child(even) .ph{order:0}
  .side{position:static}
  .sec-h{grid-template-columns:1fr}
  footer .grid{grid-template-columns:1fr 1fr}
  footer .grid>div:first-child{grid-column:1/-1}
}
@media (max-width:640px){
  body{font-size:15px;padding-bottom:calc(62px + env(safe-area-inset-bottom,0px))}
  .split h1{font-size:clamp(44px,13vw,64px)}
  .split .acts .btn{flex:1}
  .logo{padding:2px 14px 4px}
  .logo small{display:none}
  .trip .ph{aspect-ratio:4/3}
  .quote .ctl{margin-top:28px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stats div:nth-child(3){border-left:0}
  .stats div:nth-child(n+3){border-top:1px solid var(--ink)}
  .facts{grid-template-columns:1fr 1fr}
  .facts div+div{border-left:0}
  .facts div:nth-child(even){border-left:1px solid color-mix(in srgb,var(--butter) 25%,transparent)}
  .facts div:nth-child(n+3){border-top:1px solid color-mix(in srgb,var(--butter) 25%,transparent)}
  .facts div{padding:16px}
  .facts b{font-size:16px}
  .tl li{grid-template-columns:72px 1fr;gap:14px}
  .tl .t{font-size:22px}
  .pager{grid-template-columns:1fr}
  .pager .next{grid-column:auto;border-left:0;border-top:1px solid var(--ink)}
  .wall{columns:2;column-gap:10px}
  .wall button{margin-bottom:10px}
  .areas{grid-template-columns:repeat(2,1fr);gap:14px}
  .areac h3{font-size:18px}
  .areac div.t{flex-direction:column;gap:0}
  .areac p{display:none}
  .area-h{grid-template-columns:1fr}
  .area-h .im{aspect-ratio:16/9}
  .anchor .t{font-size:32px}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;inset:auto 0 0;z-index:45;background:var(--bg);border-top:1px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;text-decoration:none;font-family:var(--f-mono);font-size:11px;color:var(--mute)}
  .tabbar svg{width:22px;height:22px}
  .tabbar a[aria-current]{color:var(--ink);font-weight:500}
  .tabbar a[aria-current] svg{background:var(--butter);border-radius:999px;padding:1px;box-sizing:content-box;width:30px}
  footer .grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

<body>
<header class="nav" id="nav">
  <div class="wrap">
    <a class="logo" href="#home" id="logo"></a>
    <nav class="menu" id="menu" aria-label="主選單"></nav>
    <button class="burger" type="button" id="burger" aria-expanded="false">
      選單
    </button>
  </div>
</header>
<div class="drawer" id="drawer" hidden role="dialog" aria-modal="true" aria-label="選單">
  <button class="x" type="button" data-close>關閉</button>
  <nav id="drawer-nav"></nav>
</div>

<div id="app"></div>

<nav class="tabbar" id="tabbar" aria-label="快速切換">
  <a href="#home" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>首頁</a>
  <a href="#home" data-tab="trip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h6a4 4 0 0 0 0-8h-4a4 4 0 0 1 0-8h6"/></svg>旅程</a>
  <a href="#home" data-tab="day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span id="tab-day">每日</span></a>
  <a href="#home" data-tab="places"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>地點</a>
</nav>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="照片">
  <img alt="">
  <button type="button" data-lb="x" aria-label="關閉">×</button>
  <button type="button" data-lb="-1" aria-label="上一張">‹</button>
  <button type="button" data-lb="1" aria-label="下一張">›</button>
  <p class="cap"><span></span></p>
</div>

<script>
// 試看色票：網址加 ?c=clay／sea／matcha／latte／dusk
try { const c = new URLSearchParams(location.search).get('c'); if (/^(clay|sea|matcha|latte|dusk)$/.test(c)) document.documentElement.dataset.palette = c; } catch (e) {}
</script>
<script src="data.js"></script>
<script>
// 新版前台：讀同一份 data.js（SITE 首頁設定、TRIPS 各趟旅程、PHOTOS 照片庫），網址格式與 index.html 相同
let G, TRIPS, PHOTOS, trip = null, D = null, SITE = null;
function load(data){ G = data.SITE; TRIPS = data.TRIPS; PHOTOS = data.PHOTOS; }
load(window.TRIP_DATA);
const app = document.getElementById('app');
const nav = document.getElementById('nav');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const EMOJI = /\p{Extended_Pictographic}️?\s?/gu;
// 原資料用表情符號標記，改成文字標籤
const clean = s => esc(s)
  .replace(/⚠️\s?/g, '<span class="warn">注意</span> ')
  .replace(/🔴\s?/g, '<span class="warn">必守</span> ')
  .replace(/⭐\s?/g, '<span class="okk">推薦</span> ')
  .replace(/🌱\s?/g, '<span class="okk">素食可</span> ')
  .replace(/✅\s?/g, '✓ ').replace(/❌\s?/g, '✕ ')
  .replace(EMOJI, '');
const plain = s => String(s).replace(/（✅?已預約）/, '').replace(/⚠️\s?/g, '').replace(EMOJI, '').trim();
const isBooked = s => /已預約|已訂/.test(s);

const dayCfg = n => (SITE.days || {})[n] || {must:[], tips:[]};
const areaCfg = a => (SITE.areas || {})[a] || {id:'area', img:'', cap:'', days:''};
// 後台預覽時，剛上傳還沒部署的照片用暫存網址
const imgSrc = (kind, n) => (window.PHOTO_OVERRIDE && window.PHOTO_OVERRIDE[kind + n]) || `photos/${kind}${n}.jpg`;
const fit = p => `object-position:center ${p == null ? 50 : p}%`;
const pic = (kind, n, alt, style, label, lazy) => n
  ? `<img src="${imgSrc(kind, n)}" alt="${esc(alt || '')}" style="${style || ''}"${lazy ? ' loading="lazy"' : ''}>`
  : `<div class="noimg" role="img" aria-label="${esc(alt || '尚未放照片')}">${esc(label || '')}</div>`;
const keysOf = d => d.items.filter(i => i.kind === 'key');
let allKeys = [];
function useTrip(id){
  trip = TRIPS.find(t => t.id === id) || null;
  if (trip){ D = trip.D; SITE = trip.S; allKeys = D.days.flatMap(d => keysOf(d).map(k => ({...k, day:d.day}))); }
  return trip;
}
const T = () => 't-' + trip.id;
const sortedTrips = () => [...TRIPS].sort((a, b) => String(b.year).localeCompare(String(a.year)) || TRIPS.indexOf(a) - TRIPS.indexOf(b));
const tripPhotos = id => PHOTOS.filter(p => p.trip === id);
const keyTag = it => isBooked(it.event) ? '已訂' : /起飛|飛/.test(it.event) ? '航班' : /船/.test(it.event) ? '船班' : '集合';

// 頁首選單與手機抽屜
function paintMenu(current){
  document.getElementById('logo').innerHTML = `${esc(G.title)}<small>Tabi-log</small>`;
  const list = sortedTrips();
  document.getElementById('menu').innerHTML = list.map(t => `<a href="#t-${t.id}"${t.id === current ? ' aria-current="page"' : ''}>${esc(t.name)}</a>`).join('')
    + `<a class="cta" href="#trips">所有旅程</a>`;
  document.getElementById('drawer-nav').innerHTML = [['#home', '首頁', ''], ...list.map(t => ['#t-' + t.id, t.name, t.status === 'planning' ? '規劃中' : t.year])]
    .map(([h, n, s]) => `<a href="${h}">${esc(n)}<small>${esc(s)}</small></a>`).join('');
}
const drawer = document.getElementById('drawer'), burger = document.getElementById('burger');
function setDrawer(open){ drawer.hidden = !open; burger.setAttribute('aria-expanded', open); document.body.style.overflow = open ? 'hidden' : ''; if (open) drawer.querySelector('.x').focus(); }
burger.addEventListener('click', () => setDrawer(true));
drawer.addEventListener('click', e => { if (e.target.closest('[data-close]') || e.target.closest('a')) setDrawer(false); });

// 頁首浮在畫面上，捲動後才加底色
function paintNav(){ nav.classList.toggle('solid', window.scrollY > 40); }
window.addEventListener('scroll', paintNav, {passive:true});

// 左照片、右奶油黃色塊的大圖區
function splitHero(o){
  return `<section class="split${o.short ? ' short' : ''}${o.inset ? ' has-inset' : ''}">
    <figure class="ph">${pic('f', o.img, o.alt || '', fit(o.pos), o.label || '')}${o.img && o.cap ? `<figcaption>${esc(o.cap)}</figcaption>` : ''}</figure>
    <div class="panel">
      ${o.kicker ? `<p class="kicker">${o.kicker}</p>` : ''}
      <h1>${o.title}</h1>
      ${o.lead ? `<p class="lead">${o.lead}</p>` : ''}
      ${o.meta && o.meta.length ? `<div class="meta">${o.meta.map(m => `<span>${esc(m)}</span>`).join('')}</div>` : ''}
      ${o.acts ? `<div class="acts">${o.acts}</div>` : ''}
      ${o.inset ? `<figure class="inset">${pic('f', o.inset.img, '', fit(o.inset.pos), '', true)}</figure>` : ''}
    </div>
  </section>`;
}

function footer(){
  const list = sortedTrips();
  return `<footer><div class="wrap">
    <p class="big">${esc(G.title)} <i>Tabi-log</i></p>
    <div class="grid">
      <div><p>${esc(G.tagline)}</p></div>
      <div><h4>旅程</h4><nav>${list.map(t => `<a href="#t-${t.id}">${esc(t.name)}</a>`).join('')}</nav></div>

// 旅程封面：封面照＋該趟另外兩張照片，拼成三聯直幅
function triptych(t){
  const first = t.S.card && t.S.card.img;
  const more = PHOTOS.filter(p => p.trip === t.id && p.n !== first).map(p => p.n);
  const pick = [first, more[Math.floor(more.length / 3)], more[Math.floor(more.length * 2 / 3)]].filter(Boolean);
  if (pick.length < 3) return pic('f', first, t.name, fit(t.S.card && t.S.card.pos), t.S.code, true);
  return `<div class="tri">${pick.map((n, i) => `<img src="${imgSrc('t', n)}" alt="" loading="lazy"${i === 0 ? ` style="${fit(t.S.card.pos)}"` : ''}>`).join('')}</div>`;
}

function tripCard(t, k){
  useTrip(t.id);
  const plan = t.status === 'planning';
  return `<a class="trip" href="#${T()}">
    <div class="ph">${triptych(t)}${plan ? '<span class="badge">規劃中</span>' : ''}${SITE.card.img && SITE.code ? `<span class="code">${esc(SITE.code)}</span>` : ''}</div>
    <div class="cap"><h3>${esc(t.name)}${SITE.route ? `<small>${esc(SITE.route)}</small>` : ''}</h3><span class="no">${String(k + 1).padStart(2, '0')}</span></div>
    <p class="tmeta"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>${esc(D.info.subtitle)}</span><span>/</span><span>${D.days.length || '—'} DAYS・${D.places.length} PLACES</span></p>
    <span class="read">${plan ? '看規劃進度' : '看這趟旅程'} <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M14 7l5 5-5 5"/></svg></span>
  </a>`;
}

let lbList = [], lbAt = 0;
function wall(list){
  lbList = list;
  return `<div class="wall">${list.map((ph, k) => `<button type="button" data-ph="${k}" aria-label="放大照片：${esc(ph.c)}"><img src="${imgSrc('t', ph.n)}" alt="${esc(ph.c)}" loading="lazy"><span>${esc(ph.c)}</span></button>`).join('')}</div>`;
}

// 輪播語錄：把每天的小叮嚀一句一句輪流放大呈現
let quotes = [], qAt = 0;
function quoteBlock(title){
  qAt = 0;
  if (!quotes.length) return '';
  return `<section class="sec quote" aria-label="${esc(title)}"><div class="wrap">
    <h2>${title}</h2>
    <p class="who" id="q-who"></p>
    <blockquote id="q-text" aria-live="polite"></blockquote>
    <div class="ctl">
      <button type="button" data-q="-1" aria-label="上一則"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
      <span id="q-n"></span>
      <button type="button" data-q="1" aria-label="下一則"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
  </div></section>`;
}
function paintQuote(){
  const q = quotes[qAt], who = document.getElementById('q-who');
  if (!q || !who) return;
  who.textContent = q.who;
  document.getElementById('q-text').textContent = `「${q.text}」`;
  document.getElementById('q-n').textContent = `${String(qAt + 1).padStart(2, '0')} / ${String(quotes.length).padStart(2, '0')}`;
}

function renderDay(n){
  const d = D.days.find(x => x.day === n) || D.days[0];
  if (!d) return renderTrip();
  const c = dayCfg(d.day), area = c.area;
  const prev = D.days.find(x => x.day === d.day - 1), next = D.days.find(x => x.day === d.day + 1);
  const cur = SITE.cur || '¥';
  const tabs = D.days.map(x => `<a href="#${T()}-day-${x.day}"${x.day === d.day ? ' aria-current="page"' : ''}><b>DAY ${x.day}</b>${esc(dayCfg(x.day).short || x.date.split(/\s|（|\(/)[0])}</a>`).join('');
  const items = d.items.map(it => {
    const key = it.kind === 'key', move = it.kind === 'move';
    const text = plain(it.event).replace(move ? /^移動\s*/ : /^集合：/, '');
    if (move) return `<li class="move"><span class="t"></span><div class="x">${esc(text)}</div></li>`;
    const tag = key ? keyTag(it) : isBooked(it.event) ? '已訂' : '';
    return `<li class="${key ? 'key' : ''}"><span class="t">${esc(it.time)}${it.until ? `<small>～${esc(it.until)}</small>` : ''}</span>
      <div class="x">${tag ? `<span class="tag">${tag}</span>` : ''}${esc(text)}</div></li>`;
  }).join('');
  const legs = d.transfers.map(t => `<div><b>${esc(t.leg)}</b>${t.time || t.cost ? `<span>${esc(t.time || '')}${t.cost ? '　' + cur + Number(t.cost).toLocaleString() : ''}</span>` : ''}<p>${clean(t.way)}</p></div>`).join('');
  const nPlaces = D.places.filter(p => p.area === area).length;
  quotes = [];
  app.innerHTML = splitHero({
    short: true, img: c.img, pos: c.pos, cap: c.cap, alt: c.cap, label: 'Day ' + d.day,
    kicker: `<a href="#${T()}" style="text-decoration:none">${esc(trip.name)}</a>　·　Day ${d.day}`,
    title: `<span class="en" style="font-style:italic">Day ${String(d.day).padStart(2, '0')}</span><span class="zh">${esc(d.title)}</span>`,

  }) + `
  <div class="daytabs"><nav class="wrap" aria-label="切換日期">${tabs}</nav></div>

    <div class="dlayout">
      <section aria-label="當日行程"><ol class="tl">${items}</ol></section>
      <aside class="side">
        ${(c.must || []).length || (c.tips || []).length || c.foot ? `<div class="box"><h3>今天的重點</h3>
          ${(c.must || []).length ? `<div class="mustl">${c.must.map(([t, x]) => `<div><b>${esc(t)}</b><span>${esc(x)}</span></div>`).join('')}</div>` : ''}
          ${(c.tips || []).length ? `<ul>${c.tips.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
          ${c.foot ? `<p class="foot">${esc(c.foot)}</p>` : ''}</div>` : ''}
        ${legs ? `<div class="box"><h3>怎麼移動</h3><div class="legs">${legs}</div></div>` : ''}
        ${area && nPlaces ? `<a class="areac" href="#${T()}-places-${areaCfg(area).id}"><div class="im" style="aspect-ratio:16/10">${pic('f', areaCfg(area).img, area, '', area, true)}</div><div class="t"><h3>${esc(area)}的景點與店家</h3><small>${nPlaces} 個</small></div>${c.hint ? `<p>${esc(c.hint)}</p>` : ''}</a>` : ''}

      ${prev ? `<a href="#${T()}-day-${prev.day}"><small>← Day ${prev.day}</small><b>${esc(prev.title)}</b></a>` : '<span></span>'}

  </main>
  ${footer()}`;
  paintMenu(trip.id);
}

// 燈箱
const lb = document.getElementById('lb');
function paintLb(){ const ph = lbList[lbAt]; if (!ph) return; lb.querySelector('img').src = imgSrc('f', ph.n); lb.querySelector('img').alt = ph.c; lb.querySelector('.cap span').textContent = `${ph.c}　${lbAt + 1} / ${lbList.length}`; }
function openLb(k){ lbAt = k; lb.hidden = false; paintLb(); document.addEventListener('keydown', lbKeys); lb.querySelector('[data-lb="x"]').focus(); }
function closeLb(){ lb.hidden = true; document.removeEventListener('keydown', lbKeys); }
function stepLb(n){ if (!lbList.length) return; lbAt = (lbAt + n + lbList.length) % lbList.length; paintLb(); }
function lbKeys(e){ if (e.key === 'Escape') closeLb(); else if (e.key === 'ArrowLeft') stepLb(-1); else if (e.key === 'ArrowRight') stepLb(1); }
lb.addEventListener('click', e => {
  const b = e.target.closest('[data-lb]');
  if (!b){ if (e.target === lb) closeLb(); return; }
  if (b.dataset.lb === 'x') closeLb(); else stepLb(+b.dataset.lb);
});
let touchX = null;
lb.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, {passive:true});
lb.addEventListener('touchend', e => { if (touchX == null) return; const dx = e.changedTouches[0].clientX - touchX; if (Math.abs(dx) > 50) stepLb(dx < 0 ? 1 : -1); touchX = null; });
app.addEventListener('click', e => {
  const b = e.target.closest('[data-ph]');
  if (b) return openLb(+b.dataset.ph);
  const q = e.target.closest('[data-q]');
  if (q && quotes.length){ qAt = (qAt + +q.dataset.q + quotes.length) % quotes.length; paintQuote(); }
});

// 底部分頁列：記住目前看的旅程與天數
let lastTrip = null, lastDay = 1;
function syncTabs(h){
  const m = h.match(/^t-([a-z0-9]+)(?:-(day|places?)-?(\w*))?$/);
  if (m && m[1] !== lastTrip){ lastTrip = m[1]; lastDay = 1; }
  if (m && m[2] === 'day') lastDay = +m[3] || 1;
  if (!lastTrip){ const first = sortedTrips().find(t => t.status !== 'planning') || TRIPS[0]; lastTrip = first && first.id; }
  const tab = !m ? 'home' : m[2] === 'day' ? 'day' : m[2] ? 'places' : 'trip';
  document.querySelectorAll('#tabbar a').forEach(a => {
    if (a.dataset.tab === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  const q = s => document.querySelector(`#tabbar [data-tab="${s}"]`);
  q('trip').href = `#t-${lastTrip}`;
  q('day').href = `#t-${lastTrip}-day-${lastDay}`;
  q('places').href = `#t-${lastTrip}-places`;
  document.getElementById('tab-day').textContent = tab === 'day' ? 'DAY ' + lastDay : '每日';
}

function route(){
  closeLb();
  const h = location.hash.replace('#', '');
  // 首頁內的錨點（#trips）只捲動，不重畫
  if (h === 'trips' && trip === null && app.querySelector('#trips')) return;
  syncTabs(h);
  let m, focused = false;
  if ((m = h.match(/^t-([a-z0-9]+)(.*)$/)) && useTrip(m[1])){
    const rest = m[2]; let r;
    if (!rest) renderTrip();
    else if ((r = rest.match(/^-day-(\d+)$/))) renderDay(+r[1]);
    else if (rest === '-places') renderPlaces();
    else if ((r = rest.match(/^-places-(\w+)$/))) focused = renderPlaces(r[1]);
    else if ((r = rest.match(/^-place-(\d+)$/))) renderPlace(+r[1]);
    else renderTrip();
  } else {
    renderHome();
    if (h === 'trips'){ document.getElementById('trips').scrollIntoView(); focused = true; }
  }
  if (!focused) window.scrollTo(0, 0);
  paintNav();
}
window.addEventListener('hashchange', route);
// 後台預覽用：套用尚未發布的資料並重畫目前頁面
window.TRAVEL = {
  apply(data, overrides){
    load(data);
    window.PHOTO_OVERRIDE = overrides || {};
    const y = window.scrollY; route(); window.scrollTo(0, y);
  },
  go(hash){ if (location.hash === '#' + hash) route(); else location.hash = hash; }
};
route();
</script>
