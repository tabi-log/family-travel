<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>家族旅行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap">
<style>
/* 新版外觀：旅遊雜誌風。標題用思源宋體、內文用思源黑體，滿版大圖＋圖文交錯 */
:root{
  color-scheme:light;
  --bg:#F7F3EC; --card:#FFFFFF; --sand:#EDE5D8; --line:#DDD3C3;
  --ink:#1F2A2E; --mute:#6A716F; --soft:#8E918C;
  --teal:#1E4D4A; --teal-2:#2F6B66; --teal-soft:#E2ECE9;
  --clay:#B5573B; --clay-soft:#F6E4DC; --gold:#C79A4B;
  --night:#14201F;
  --f-serif:"Noto Serif TC","Source Han Serif TC","思源宋體",serif;
  --f-sans:"Noto Sans TC","Source Han Sans TC","思源黑體","PingFang TC","Microsoft JhengHei",sans-serif;
  --gut:max(16px,env(safe-area-inset-left,0px));
  --r:14px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{margin:0;font-family:var(--f-serif);font-weight:700;line-height:1.3;letter-spacing:.02em;text-wrap:balance}
p{margin:0}
a{color:inherit}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
a:focus-visible,button:focus-visible{outline:2px solid var(--clay);outline-offset:3px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding-left:var(--gut);padding-right:max(16px,env(safe-area-inset-right,0px))}
.kicker{font-size:13px;font-weight:700;letter-spacing:.32em;color:var(--clay)}
.sec{padding-block:clamp(56px,9vw,112px)}
.sec-h{text-align:center;max-width:640px;margin:0 auto clamp(32px,5vw,56px)}
.sec-h h2{font-size:clamp(28px,4.4vw,44px);margin-top:10px}
.sec-h p{color:var(--mute);margin-top:12px}
.sec-h::after{content:"";display:block;width:44px;height:2px;background:var(--gold);margin:22px auto 0}
.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 28px;border-radius:999px;background:var(--clay);color:#fff;text-decoration:none;font-weight:700;font-size:15px;letter-spacing:.08em;border:0;transition:background .2s,transform .2s}
.btn:hover{background:#9B4730;transform:translateY(-1px)}
.btn.ghost{background:transparent;border:1.5px solid currentColor}
.btn.ghost:hover{background:rgba(255,255,255,.14)}
.btn.line{background:transparent;color:var(--teal);border:1.5px solid var(--teal)}
.btn.line:hover{background:var(--teal);color:#fff}
.more{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--teal);text-decoration:none;letter-spacing:.06em;font-size:15px}
.more::after{content:"→";transition:transform .2s}
a:hover .more::after,.more:hover::after{transform:translateX(4px)}
.noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--teal) 0%,var(--teal-2) 55%,var(--gold) 140%);color:rgba(255,255,255,.85);font-family:var(--f-serif);font-size:clamp(18px,3vw,28px);letter-spacing:.2em;text-align:center;padding:16px}
.warn{display:inline-block;font-size:12px;font-weight:700;padding:0 8px;border-radius:999px;background:var(--clay-soft);color:var(--clay);margin-right:2px}
.okk{display:inline-block;font-size:12px;font-weight:700;padding:0 8px;border-radius:999px;background:var(--teal-soft);color:var(--teal);margin-right:2px}

/* 頁首：在大圖上是透明，捲動後變實色 */
.nav{position:fixed;inset:0 0 auto;z-index:50;padding-top:env(safe-area-inset-top,0px);transition:background .3s,box-shadow .3s,color .3s;color:var(--ink);background:rgba(247,243,236,.96);box-shadow:0 1px 0 var(--line)}
.nav.over{background:transparent;box-shadow:none;color:#fff}
.nav .wrap{height:68px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:baseline;gap:10px;text-decoration:none;font-family:var(--f-serif);font-weight:900;font-size:21px;letter-spacing:.12em;white-space:nowrap}
.logo small{font-family:var(--f-sans);font-size:11px;font-weight:500;letter-spacing:.3em;opacity:.75}
.menu{margin-left:auto;display:flex;gap:4px}
.menu a{padding:8px 14px;text-decoration:none;font-size:15px;letter-spacing:.08em;border-radius:999px;position:relative}
.menu a::after{content:"";position:absolute;left:14px;right:14px;bottom:4px;height:1.5px;background:currentColor;transform:scaleX(0);transition:transform .25s}
.menu a:hover::after,.menu a[aria-current]::after{transform:scaleX(1)}
.burger{display:none;margin-left:auto;background:none;border:0;width:44px;height:44px;align-items:center;justify-content:center}
.burger svg{width:26px;height:26px}
.drawer{position:fixed;inset:0;z-index:60;background:var(--night);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 20px) 28px 40px;display:flex;flex-direction:column}
.drawer .x{align-self:flex-end;background:none;border:0;color:#fff;width:44px;height:44px;font-size:30px;line-height:1}
.drawer nav{margin-top:24px;display:flex;flex-direction:column}
.drawer nav a{padding:16px 0;border-bottom:1px solid rgba(255,255,255,.12);text-decoration:none;font-family:var(--f-serif);font-size:24px;display:flex;justify-content:space-between;align-items:baseline}
.drawer nav a small{font-family:var(--f-sans);font-size:13px;opacity:.6;letter-spacing:.1em}

/* 大圖 */
.hero{position:relative;min-height:clamp(560px,100svh,980px);display:flex;align-items:center;color:#fff;overflow:hidden;background:var(--night)}
.hero.short{min-height:clamp(440px,72svh,760px);align-items:flex-end}
.hero>.bg{position:absolute;inset:0}
.hero>.bg img{width:100%;height:100%;object-fit:cover;animation:zoom 14s ease-out both}
@keyframes zoom{from{transform:scale(1.08)}to{transform:scale(1)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,18,18,.55) 0%,rgba(10,18,18,.15) 40%,rgba(10,18,18,.7) 100%)}
.hero .wrap{position:relative;z-index:1;width:100%;padding-top:96px;padding-bottom:clamp(48px,8vw,96px)}
.hero .kicker{color:#F1D6A6}
.hero h1{font-size:clamp(40px,8vw,88px);font-weight:900;margin-top:14px;letter-spacing:.06em;text-shadow:0 2px 24px rgba(0,0,0,.25)}
.hero .lead{font-size:clamp(16px,2vw,20px);margin-top:16px;max-width:36em;opacity:.92}
.hero .acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.hero .cap{position:absolute;z-index:1;right:var(--gut);bottom:20px;font-size:12px;letter-spacing:.12em;opacity:.75}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:18px;font-size:15px;opacity:.92}
.hero .meta span{display:flex;align-items:center;gap:8px}
.hero .meta span+span::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--gold);margin-right:14px}
.scroll-cue{position:absolute;z-index:1;left:50%;bottom:22px;transform:translateX(-50%);width:26px;height:42px;border:1.5px solid rgba(255,255,255,.7);border-radius:14px}
.scroll-cue::after{content:"";position:absolute;left:50%;top:8px;width:3px;height:8px;margin-left:-1.5px;border-radius:2px;background:#fff;animation:cue 1.8s infinite}
@keyframes cue{0%{opacity:0;transform:translateY(0)}40%{opacity:1}100%{opacity:0;transform:translateY(12px)}}

/* 數字列 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-radius:var(--r);box-shadow:0 20px 50px -24px rgba(30,40,40,.35);position:relative;z-index:2;margin-top:-56px}
.stats div{padding:26px 12px;text-align:center}
.stats div+div{border-left:1px solid var(--line)}
.stats b{display:block;font-family:var(--f-serif);font-size:clamp(28px,4vw,42px);font-weight:900;color:var(--teal);line-height:1.1}
.stats span{font-size:14px;color:var(--mute);letter-spacing:.12em}

/* 介紹區（圖文） */
.intro{display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(32px,6vw,80px);align-items:center}
.intro .pics{position:relative;aspect-ratio:1/1}
.intro .pics figure{position:absolute;margin:0;overflow:hidden;border-radius:var(--r);box-shadow:0 24px 50px -28px rgba(0,0,0,.45)}
.intro .pics figure img,.intro .pics figure .noimg{width:100%;height:100%;object-fit:cover}
.intro .pics .a{inset:0 22% 18% 0}
.intro .pics .b{inset:42% 0 0 46%;border:8px solid var(--bg)}
.intro h2{font-size:clamp(28px,4vw,42px);margin-top:12px}
.intro p.body{color:var(--mute);margin-top:18px}
.intro ul{list-style:none;padding:0;margin:26px 0 30px;display:grid;gap:12px}
.intro li{display:flex;gap:14px;align-items:baseline}
.intro li b{font-family:var(--f-serif);color:var(--clay);min-width:3.4em}

/* 旅程卡片 */
.trips{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(20px,3vw,32px)}
.trip{display:flex;flex-direction:column;background:var(--card);border-radius:var(--r);overflow:hidden;text-decoration:none;box-shadow:0 10px 30px -20px rgba(30,40,40,.4);transition:transform .3s,box-shadow .3s}
.trip:hover{transform:translateY(-6px);box-shadow:0 26px 50px -24px rgba(30,40,40,.45)}
.trip .ph{position:relative;aspect-ratio:4/3.4;overflow:hidden}
.trip .ph img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.trip:hover .ph img{transform:scale(1.06)}
.trip .yr{position:absolute;left:16px;top:16px;background:rgba(255,255,255,.94);color:var(--teal);font-family:var(--f-serif);font-weight:900;padding:4px 14px;border-radius:999px;font-size:15px}
.trip .badge{position:absolute;right:16px;top:16px;background:var(--clay);color:#fff;font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px;letter-spacing:.1em}
.trip .body{padding:24px 24px 26px;display:flex;flex-direction:column;gap:8px;flex:1}
.trip .code{font-size:12px;font-weight:700;letter-spacing:.24em;color:var(--clay)}
.trip h3{font-size:26px}
.trip .sub{color:var(--mute);font-size:15px}
.trip .route{font-size:14px;color:var(--teal-2);border-top:1px dashed var(--line);padding-top:12px;margin-top:6px}
.trip .tfacts{display:flex;gap:18px;font-size:14px;color:var(--mute);margin-top:auto;padding-top:14px}
.trip .tfacts b{font-family:var(--f-serif);color:var(--ink);font-size:18px;margin-right:2px}
.trip .more{margin-top:10px}

/* 照片牆 */
.wall{columns:4 220px;column-gap:14px}
.wall button{display:block;width:100%;margin:0 0 14px;padding:0;border:0;border-radius:10px;overflow:hidden;break-inside:avoid;position:relative;background:var(--sand)}
.wall img{width:100%;height:auto;transition:transform .5s}
.wall button:hover img{transform:scale(1.05)}
.wall button span{position:absolute;inset:auto 0 0;padding:28px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-size:13px;text-align:left;opacity:0;transition:opacity .3s}
.wall button:hover span,.wall button:focus-visible span{opacity:1}

/* 頁尾 */
footer{background:var(--night);color:rgba(255,255,255,.78);padding:clamp(48px,7vw,80px) 0 calc(28px + env(safe-area-inset-bottom,0px))}
footer .grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:32px}
footer .logo{color:#fff;font-size:24px}
footer p{margin-top:12px;font-size:14px;line-height:1.9}
footer h4{margin:0 0 12px;font-size:13px;letter-spacing:.24em;color:var(--gold);font-weight:700}
footer nav{display:flex;flex-direction:column;gap:6px;font-size:15px}
footer nav a{text-decoration:none;opacity:.85}
footer nav a:hover{opacity:1;text-decoration:underline}
footer .copy{border-top:1px solid rgba(255,255,255,.12);margin-top:40px;padding-top:20px;font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;opacity:.7}

/* 旅程頁：資訊卡 */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));background:var(--card);border-radius:var(--r);box-shadow:0 20px 50px -24px rgba(30,40,40,.35);position:relative;z-index:2;margin-top:-48px}
.facts div{padding:22px 24px}
.facts div+div{border-left:1px solid var(--line)}
.facts small{display:block;font-size:13px;letter-spacing:.14em;color:var(--clay);font-weight:700}
.facts b{display:block;font-family:var(--f-serif);font-size:18px;margin-top:4px;line-height:1.5}

/* 每日（圖文交錯） */
.days{display:grid;gap:clamp(40px,7vw,96px)}
.dayrow{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(24px,5vw,72px);align-items:center}
.dayrow:nth-child(even) .ph{order:2}
.dayrow .ph{position:relative;aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;display:block}
.dayrow .ph img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.dayrow .ph:hover img{transform:scale(1.04)}
.dayrow .ph figcaption{position:absolute;left:14px;bottom:12px;color:#fff;font-size:12px;letter-spacing:.1em;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.dayrow .num{font-family:var(--f-serif);font-size:clamp(56px,8vw,88px);font-weight:900;line-height:1;color:var(--sand);display:flex;align-items:baseline;gap:14px}
.dayrow .num small{font-family:var(--f-sans);font-size:14px;font-weight:700;color:var(--clay);letter-spacing:.24em}
.dayrow h3{font-size:clamp(24px,3.2vw,34px);margin-top:4px}
.dayrow .date{color:var(--mute);font-size:15px;margin-top:6px}
.dayrow ul{list-style:none;padding:0;margin:20px 0 24px;display:grid;gap:10px}
.dayrow li{position:relative;padding-left:22px;color:#3d4645}
.dayrow li::before{content:"";position:absolute;left:2px;top:.72em;width:8px;height:8px;border-radius:50%;border:2px solid var(--gold)}
.dayrow .must{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.dayrow .must span{font-size:13px;background:var(--clay-soft);color:var(--clay);padding:3px 12px;border-radius:999px}
.dayrow .must b{font-weight:700;margin-right:6px}

/* 重要時間 */
.band{background:var(--teal);color:#fff}
.band .sec-h p{color:rgba(255,255,255,.7)}
.band .sec-h::after{background:var(--gold)}
.band .kicker{color:#F1D6A6}
.anchors{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
.anchor{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:var(--r);padding:20px 22px;display:flex;gap:18px;align-items:flex-start;text-decoration:none;transition:background .2s}
.anchor:hover{background:rgba(255,255,255,.13)}
.anchor .t{font-family:var(--f-serif);font-size:28px;font-weight:900;color:#F1D6A6;line-height:1.1;min-width:3.2em}
.anchor small{display:block;font-size:12px;letter-spacing:.2em;opacity:.7}
.anchor p{font-size:15px;margin-top:2px}

/* 區域卡片 */
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:18px}
.areac{position:relative;aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;color:#fff;text-decoration:none;display:block}
.areac img,.areac .noimg{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.areac:hover img{transform:scale(1.06)}
.areac::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(10,18,18,.8))}
.areac div{position:absolute;z-index:1;left:20px;right:20px;bottom:18px}
.areac small{font-size:12px;letter-spacing:.22em;opacity:.85}
.areac h3{font-size:26px}
.areac p{font-size:14px;opacity:.85}

/* 實用資訊（摺疊） */
.acc{max-width:860px;margin:0 auto;display:grid;gap:12px}
.acc details{background:var(--card);border-radius:var(--r);border:1px solid var(--line)}
.acc summary{list-style:none;cursor:pointer;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:16px;font-family:var(--f-serif);font-weight:700;font-size:18px}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";font-family:var(--f-sans);font-size:24px;color:var(--clay);transition:transform .25s;line-height:1}
.acc details[open] summary::after{transform:rotate(45deg)}
.acc details p{padding:0 22px 20px;color:#3d4645}

/* 每日頁 */
.daytabs{position:sticky;top:calc(68px + env(safe-area-inset-top,0px));z-index:40;background:rgba(247,243,236,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.daytabs nav{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.daytabs nav::-webkit-scrollbar{display:none}
.daytabs a{flex:none;text-decoration:none;padding:6px 16px;border-radius:999px;font-size:14px;border:1px solid var(--line);background:var(--card);white-space:nowrap}
.daytabs a b{font-family:var(--f-serif);margin-right:6px}
.daytabs a[aria-current]{background:var(--teal);border-color:var(--teal);color:#fff}
.dlayout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:clamp(28px,5vw,64px);align-items:start}
.tl{position:relative;list-style:none;margin:0;padding:0}
.tl::before{content:"";position:absolute;left:78px;top:10px;bottom:10px;width:2px;background:var(--line)}
.tl li{position:relative;display:grid;grid-template-columns:64px 1fr;gap:32px;padding:14px 0}
.tl li::before{content:"";position:absolute;left:72px;top:23px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2.5px solid var(--teal-2)}
.tl .t{font-family:var(--f-serif);font-weight:700;font-size:18px;color:var(--teal);text-align:right;line-height:1.5;padding-top:4px}
.tl .t small{display:block;font-family:var(--f-sans);font-weight:400;font-size:12px;color:var(--soft)}
.tl .x{background:var(--card);border-radius:12px;padding:12px 18px;box-shadow:0 6px 20px -16px rgba(30,40,40,.5)}
.tl .tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.1em;padding:1px 10px;border-radius:999px;margin-bottom:4px;background:var(--teal-soft);color:var(--teal)}
.tl li.key::before{background:var(--clay);border-color:var(--clay);box-shadow:0 0 0 5px var(--clay-soft)}
.tl li.key .x{border-left:4px solid var(--clay)}
.tl li.key .tag{background:var(--clay-soft);color:var(--clay)}
.tl li.move{padding:4px 0}
.tl li.move::before{width:8px;height:8px;left:75px;top:16px;border:0;background:var(--line)}
.tl li.move .x{background:transparent;box-shadow:none;padding:4px 0;color:var(--mute);font-size:14px}
.tl li.move .x::before{content:"↓ ";color:var(--gold);font-weight:700}
.side{position:sticky;top:150px;display:grid;gap:18px}
.box{background:var(--card);border-radius:var(--r);padding:24px 24px 26px;border:1px solid var(--line)}
.box h3{font-size:20px;display:flex;align-items:center;gap:10px}
.box h3::before{content:"";width:6px;height:20px;background:var(--gold);border-radius:3px}
.box .mustl{display:grid;gap:8px;margin-top:16px}
.box .mustl div{display:flex;gap:12px;background:var(--clay-soft);border-radius:10px;padding:10px 14px;font-size:15px}
.box .mustl b{font-family:var(--f-serif);color:var(--clay);flex:none}
.box ul{margin:16px 0 0;padding-left:1.2em;display:grid;gap:8px;color:#3d4645}
.box .foot{margin-top:14px;font-size:14px;color:var(--mute)}
.legs{display:grid;gap:12px;margin-top:16px}
.legs div{border-top:1px dashed var(--line);padding-top:12px}
.legs div:first-child{border-top:0;padding-top:0}
.legs b{display:block;font-size:15px}
.legs span{font-size:13px;color:var(--clay);font-weight:700}
.legs p{font-size:14px;color:var(--mute)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:clamp(48px,7vw,80px)}
.pager a{display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 22px;text-decoration:none;transition:border-color .2s}
.pager a:hover{border-color:var(--teal)}
.pager small{display:block;font-size:12px;letter-spacing:.2em;color:var(--clay);font-weight:700}
.pager b{font-family:var(--f-serif);font-size:18px}
.pager .next{text-align:right;grid-column:2}

/* 景點與店家 */
.pagehead{padding-top:calc(68px + env(safe-area-inset-top,0px) + clamp(40px,6vw,72px));text-align:center}
.pagehead h1{font-size:clamp(34px,6vw,58px);font-weight:900;margin-top:10px}
.pagehead p{color:var(--mute);margin-top:12px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:24px}
.chips a,.chips button{text-decoration:none;padding:7px 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px}
.chips a span{color:var(--clay);font-weight:700;margin-left:4px}
.chips button[aria-pressed="true"]{background:var(--teal);color:#fff;border-color:var(--teal)}
.area{margin-top:clamp(48px,7vw,88px);scroll-margin-top:96px}
.area-h{position:relative;border-radius:var(--r);overflow:hidden;height:clamp(180px,26vw,280px);color:#fff;display:flex;align-items:flex-end}
.area-h>img,.area-h>.noimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.area-h::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,18,18,.75),rgba(10,18,18,.1))}
.area-h div{position:relative;z-index:1;padding:24px 28px}
.area-h small{font-size:12px;letter-spacing:.24em;opacity:.85}
.area-h h2{font-size:clamp(28px,4vw,40px)}
.area-h h2 span{font-family:var(--f-sans);font-size:15px;font-weight:500;opacity:.8;margin-left:8px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px;margin-top:20px}
.pc{display:flex;flex-direction:column;gap:6px;background:var(--card);border-radius:var(--r);padding:20px 22px;text-decoration:none;border:1px solid transparent;box-shadow:0 8px 24px -20px rgba(30,40,40,.5);transition:border-color .2s,transform .2s}
.pc:hover{border-color:var(--teal-2);transform:translateY(-2px)}
.pc .top{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:700;letter-spacing:.12em}
.pc .top .k{padding:1px 10px;border-radius:999px;background:var(--teal-soft);color:var(--teal)}
.pc.eat .top .k{background:var(--clay-soft);color:var(--clay)}
.pc .top .tg{color:var(--soft)}
.pc .top .rs{margin-left:auto;color:var(--teal)}
.pc h3{font-size:19px}
.pc p{font-size:14px;color:var(--mute);line-height:1.7}

/* 地點詳情 */
.pd{max-width:860px;margin:0 auto;text-align:center}
.pd .pills{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:18px}
.pd .pills span{font-size:13px;padding:3px 14px;border-radius:999px;background:var(--sand)}
.pd .pills .ok{background:var(--teal-soft);color:var(--teal);font-weight:700}
.pd .desc{font-size:18px;margin-top:26px;line-height:1.9}
.pd .btn{margin-top:30px}
.pphotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px;margin-top:clamp(40px,6vw,64px)}
.pphotos button{padding:0;border:0;border-radius:12px;overflow:hidden;aspect-ratio:4/3;background:var(--sand)}
.pphotos img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.pphotos button:hover img{transform:scale(1.05)}
.empty{text-align:center;color:var(--mute);padding:48px 16px;background:var(--card);border-radius:var(--r);border:1px dashed var(--line)}

/* 燈箱 */
.lb{position:fixed;inset:0;z-index:80;background:rgba(8,12,12,.94);display:flex;align-items:center;justify-content:center;padding:56px 12px 72px}
.lb img{max-width:min(100%,1100px);max-height:100%;object-fit:contain;border-radius:6px}
.lb .cap{position:absolute;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));text-align:center;color:#fff;font-size:14px;padding:0 64px}
.lb button{position:absolute;background:rgba(255,255,255,.12);border:0;color:#fff;width:48px;height:48px;border-radius:50%;font-size:24px;line-height:1}
.lb button:hover{background:rgba(255,255,255,.24)}
.lb [data-lb="x"]{top:calc(12px + env(safe-area-inset-top,0px));right:12px}
.lb [data-lb="-1"]{left:12px;top:50%;margin-top:-24px}
.lb [data-lb="1"]{right:12px;top:50%;margin-top:-24px}

/* 手機底部分頁列 */
.tabbar{display:none}

@media (max-width:860px){
  .menu{display:none}
  .burger{display:flex}
  .intro,.dayrow,.dlayout{grid-template-columns:1fr}
  .dayrow:nth-child(even) .ph{order:0}
  .intro .pics{max-width:520px;width:100%;margin:0 auto}
  .side{position:static}
  footer .grid{grid-template-columns:1fr 1fr}
  footer .grid>div:first-child{grid-column:1/-1}
}
@media (max-width:640px){
  body{font-size:15px;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .stats{grid-template-columns:repeat(2,1fr);margin-top:-40px}
  .stats div:nth-child(3){border-left:0}
  .stats div:nth-child(n+3){border-top:1px solid var(--line)}
  .facts{grid-template-columns:1fr 1fr;margin-top:-32px}
  .facts div+div{border-left:0}
  .facts div:nth-child(even){border-left:1px solid var(--line)}
  .facts div:nth-child(n+3){border-top:1px solid var(--line)}
  .facts div{padding:14px 16px}
  .facts b{font-size:16px}
  .hero.short .wrap{padding-bottom:64px}
  .hero .acts .btn{padding:12px 20px;font-size:14px;white-space:nowrap}
  .scroll-cue{display:none}
  .tl::before{left:58px}
  .tl li{grid-template-columns:48px 1fr;gap:26px}
  .tl li::before{left:52px}
  .tl li.move::before{left:55px}
  .tl .t{font-size:16px}
  .pager{grid-template-columns:1fr}
  .pager .next{grid-column:auto}
  .wall{columns:2;column-gap:10px}
  .wall button{margin-bottom:10px}
  .areas{grid-template-columns:repeat(2,1fr);gap:12px}
  .areac{aspect-ratio:3/4}
  .areac div{left:14px;right:14px;bottom:12px}
  .areac h3{font-size:20px}
  .areac p{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;inset:auto 0 0;z-index:45;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;text-decoration:none;font-size:11px;color:var(--soft);letter-spacing:.06em}
  .tabbar svg{width:22px;height:22px}
  .tabbar a[aria-current]{color:var(--teal);font-weight:700}
  footer .grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<header class="nav" id="nav">
  <div class="wrap">
    <a class="logo" href="#home" id="logo"></a>
    <nav class="menu" id="menu" aria-label="主選單"></nav>
    <button class="burger" type="button" id="burger" aria-label="開啟選單" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
</header>
<div class="drawer" id="drawer" hidden role="dialog" aria-modal="true" aria-label="選單">
  <button class="x" type="button" data-close aria-label="關閉選單">×</button>
  <nav id="drawer-nav"></nav>
</div>

<div id="app"></div>

<nav class="tabbar" id="tabbar" aria-label="快速切換">
  <a href="#home" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>首頁</a>
  <a href="#home" data-tab="trip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h6a4 4 0 0 0 0-8h-4a4 4 0 0 1 0-8h6"/></svg>旅程</a>
  <a href="#home" data-tab="day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span id="tab-day">每日</span></a>
  <a href="#home" data-tab="places"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>地點</a>
</nav>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="照片">
  <img alt="">
  <button type="button" data-lb="x" aria-label="關閉">×</button>
  <button type="button" data-lb="-1" aria-label="上一張">‹</button>
  <button type="button" data-lb="1" aria-label="下一張">›</button>
  <p class="cap"><span></span></p>
</div>

<script src="data.js"></script>
<script>
// 新版前台：讀同一份 data.js（SITE 首頁設定、TRIPS 各趟旅程、PHOTOS 照片庫），網址格式與 index.html 相同
let G, TRIPS, PHOTOS, trip = null, D = null, SITE = null;
function load(data){ G = data.SITE; TRIPS = data.TRIPS; PHOTOS = data.PHOTOS; }
load(window.TRIP_DATA);
const app = document.getElementById('app');
const nav = document.getElementById('nav');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const EMOJI = /\p{Extended_Pictographic}️?\s?/gu;
// 原資料用表情符號標記，改成文字標籤
const clean = s => esc(s)
  .replace(/⚠️\s?/g, '<span class="warn">注意</span> ')
  .replace(/🔴\s?/g, '<span class="warn">必守</span> ')
  .replace(/⭐\s?/g, '<span class="okk">推薦</span> ')
  .replace(/🌱\s?/g, '<span class="okk">素食可</span> ')
  .replace(/✅\s?/g, '✓ ').replace(/❌\s?/g, '✕ ')
  .replace(EMOJI, '');
const plain = s => String(s).replace(/（✅?已預約）/, '').replace(/⚠️\s?/g, '').replace(EMOJI, '').trim();
const isBooked = s => /已預約|已訂/.test(s);

const dayCfg = n => (SITE.days || {})[n] || {must:[], tips:[]};
const areaCfg = a => (SITE.areas || {})[a] || {id:'area', img:'', cap:'', days:''};
// 後台預覽時，剛上傳還沒部署的照片用暫存網址
const imgSrc = (kind, n) => (window.PHOTO_OVERRIDE && window.PHOTO_OVERRIDE[kind + n]) || `photos/${kind}${n}.jpg`;
const fit = p => `object-position:center ${p == null ? 50 : p}%`;
const pic = (kind, n, alt, style, label, lazy) => n
  ? `<img src="${imgSrc(kind, n)}" alt="${esc(alt || '')}" style="${style || ''}"${lazy ? ' loading="lazy"' : ''}>`
  : `<div class="noimg" role="img" aria-label="${esc(alt || '尚未放照片')}">${esc(label || '')}</div>`;
const keysOf = d => d.items.filter(i => i.kind === 'key');
let allKeys = [];
function useTrip(id){
  trip = TRIPS.find(t => t.id === id) || null;
  if (trip){ D = trip.D; SITE = trip.S; allKeys = D.days.flatMap(d => keysOf(d).map(k => ({...k, day:d.day}))); }
  return trip;
}
const T = () => 't-' + trip.id;
const sortedTrips = () => [...TRIPS].sort((a, b) => String(b.year).localeCompare(String(a.year)) || TRIPS.indexOf(a) - TRIPS.indexOf(b));
const tripPhotos = id => PHOTOS.filter(p => p.trip === id);
const keyTag = it => isBooked(it.event) ? '已訂' : /起飛|飛/.test(it.event) ? '航班' : /船/.test(it.event) ? '船班' : '集合';

// 頁首選單與手機抽屜
function paintMenu(current){
  document.getElementById('logo').innerHTML = `${esc(G.title)}<small>TABI-LOG</small>`;
  const items = [['#home', '首頁', 'home'], ...sortedTrips().map(t => ['#t-' + t.id, t.name, t.id])];
  document.getElementById('menu').innerHTML = items.map(([h, n, k]) => `<a href="${h}"${k === current ? ' aria-current="page"' : ''}>${esc(n)}</a>`).join('');
  document.getElementById('drawer-nav').innerHTML = [['#home', '首頁', ''], ...sortedTrips().map(t => ['#t-' + t.id, t.name, t.status === 'planning' ? '規劃中' : t.year])]
    .map(([h, n, s]) => `<a href="${h}">${esc(n)}<small>${esc(s)}</small></a>`).join('');
}
const drawer = document.getElementById('drawer'), burger = document.getElementById('burger');
function setDrawer(open){ drawer.hidden = !open; burger.setAttribute('aria-expanded', open); document.body.style.overflow = open ? 'hidden' : ''; if (open) drawer.querySelector('.x').focus(); }
burger.addEventListener('click', () => setDrawer(true));
drawer.addEventListener('click', e => { if (e.target.closest('[data-close]') || e.target.closest('a')) setDrawer(false); });

// 有大圖的頁面，頁首在圖上是透明的
let heroPage = false;
function paintNav(){ nav.classList.toggle('over', heroPage && window.scrollY < 60); }
window.addEventListener('scroll', paintNav, {passive:true});

function footer(){
  const list = sortedTrips();
  return `<footer><div class="wrap">
    <div class="grid">
      <div><a class="logo" href="#home">${esc(G.title)}<small>TABI-LOG</small></a><p>${esc(G.tagline)}</p></div>
      <div><h4>旅程</h4><nav>${list.map(t => `<a href="#t-${t.id}">${esc(t.name)}</a>`).join('')}</nav></div>
      <div><h4>年份</h4><nav>${list.map(t => `<a href="#t-${t.id}">${esc(t.status === 'planning' ? '規劃中' : t.year)}</a>`).join('')}</nav></div>
    </div>
    <div class="copy"><span>${esc(G.title)}</span><span>tabi-log</span></div>
  </div></footer>`;
}

function tripCard(t){
  useTrip(t.id);
  const plan = t.status === 'planning';
  return `<a class="trip" href="#${T()}">
    <div class="ph">${pic('f', SITE.card.img, t.name, fit(SITE.card.pos), SITE.code, true)}
      <span class="yr">${esc(plan ? 'NEXT' : t.year)}</span>${plan ? '<span class="badge">規劃中</span>' : ''}</div>
    <div class="body">
      <p class="code">${esc(SITE.code || '')}</p>
      <h3>${esc(t.name)}</h3>
      <p class="sub">${esc(D.info.subtitle)}</p>
      ${SITE.route ? `<p class="route">${esc(SITE.route)}</p>` : ''}
      <div class="tfacts"><span><b>${D.days.length || '—'}</b>天</span><span><b>${esc(SITE.people)}</b>人</span><span><b>${D.places.length}</b>地點</span></div>
      <span class="more">${plan ? '看規劃進度' : '查看行程'}</span>
    </div>
  </a>`;
}

let lbList = [], lbAt = 0;
function wall(list){
  lbList = list;
  return `<div class="wall">${list.map((ph, k) => `<button type="button" data-ph="${k}" aria-label="放大照片：${esc(ph.c)}"><img src="${imgSrc('t', ph.n)}" alt="${esc(ph.c)}" loading="lazy"><span>${esc(ph.c)}</span></button>`).join('')}</div>`;
}

function renderHome(){
  const list = sortedTrips();
  const total = {d:0, p:0};
  TRIPS.forEach(t => { total.d += t.D.days.length; total.p += t.D.places.length; });
  const done = TRIPS.filter(t => t.status !== 'planning');
  const h = G.home.hero;
  // 介紹區的兩張照片：取已完成旅程的封面
  const covers = done.map(t => t.S.card).filter(c => c && c.img);
  const next = TRIPS.find(t => t.status === 'planning');
  const cards = list.map(tripCard).join('');
  trip = null;
  const photos = PHOTOS.filter(p => p.trip).slice(0, 16);
  app.innerHTML = `
  <section class="hero">
    <div class="bg">${pic('f', h.img, h.cap, fit(h.pos), '')}</div>
    <div class="wrap">
      <p class="kicker">FAMILY TRAVEL JOURNAL</p>
      <h1>${esc(G.title)}</h1>
      <p class="lead">${esc(G.tagline)}</p>
      <div class="acts"><a class="btn" href="#trips">看所有旅程</a>${next ? `<a class="btn ghost" href="#t-${next.id}">下一站：${esc(next.name)}</a>` : ''}</div>
    </div>
    ${h.img && h.cap ? `<span class="cap">${esc(h.cap)}</span>` : ''}
    <span class="scroll-cue" aria-hidden="true"></span>
  </section>
  <div class="wrap">
    <div class="stats"><div><b>${done.length}</b><span>趟旅程</span></div><div><b>${total.d}</b><span>天</span></div><div><b>${total.p}</b><span>個地點</span></div><div><b>${PHOTOS.length}</b><span>張照片</span></div></div>
  </div>
  <section class="sec"><div class="wrap intro">
    <div class="pics">
      <figure class="a">${covers[0] ? pic('f', covers[0].img, '', fit(covers[0].pos), '', true) : pic('f', '', '', '', G.title)}</figure>
      <figure class="b">${covers[1] ? pic('f', covers[1].img, '', fit(covers[1].pos), '', true) : pic('f', '', '', '', '')}</figure>
    </div>
    <div>
      <p class="kicker">ABOUT US</p>
      <h2>一家四口，一趟一條路線</h2>
      <p class="body">每一趟都記下每天的行程、集合時間、交通方式，還有吃過、逛過的地方。</p>
      <ul>${list.map(t => `<li><b>${esc(t.status === 'planning' ? '規劃中' : t.year)}</b><span>${esc(t.name)}${t.S.route ? '　' + esc(t.S.route) : ''}</span></li>`).join('')}</ul>
      <a class="btn line" href="#trips">開始瀏覽</a>
    </div>
  </div></section>
  <section class="sec" id="trips" style="background:var(--sand);scroll-margin-top:40px"><div class="wrap">
    <div class="sec-h"><p class="kicker">OUR JOURNEYS</p><h2>我們的旅程</h2><p>點進每一趟，看每日路線、重要時間與景點店家。</p></div>
    <div class="trips">${cards}</div>
  </div></section>
  ${photos.length ? `<section class="sec"><div class="wrap">
    <div class="sec-h"><p class="kicker">GALLERY</p><h2>旅途剪影</h2><p>點照片可以放大瀏覽。</p></div>
    ${wall(photos)}
  </div></section>` : ''}
  ${footer()}`;
  heroPage = true;
  paintMenu('home');
}

function renderTrip(){
  const plan = trip.status === 'planning';
  const facts = D.info.highlights.map(h => `<div><small>${esc(h.label)}</small><b>${esc(h.value)}</b></div>`).join('');
  const info = (SITE.info || []).filter(x => x.k || x.v);
  const days = D.days.map(d => {
    const c = dayCfg(d.day);
    return `<article class="dayrow">
      <a class="ph" href="#${T()}-day-${d.day}" aria-label="DAY ${d.day} ${esc(d.title)}">${pic('f', c.img, c.cap, fit(c.pos), 'DAY ' + d.day, true)}${c.img && c.cap ? `<figcaption>${esc(c.cap)}</figcaption>` : ''}</a>
      <div>
        <p class="num">${String(d.day).padStart(2, '0')}<small>DAY ${d.day}${c.area ? '・' + esc(c.area) : ''}</small></p>
        <h3>${esc(d.title)}</h3>
        <p class="date">${esc(d.date)}</p>
        ${(c.must || []).length ? `<div class="must">${c.must.map(([t, x]) => `<span><b>${esc(t)}</b>${esc(x)}</span>`).join('')}</div>` : ''}
        ${(c.tips || []).length ? `<ul>${c.tips.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '<div style="height:20px"></div>'}
        <a class="more" href="#${T()}-day-${d.day}">看當天行程</a>
      </div>
    </article>`;
  }).join('');
  const areas = D.areaOrder.map(a => {
    const A = areaCfg(a), n = D.places.filter(p => p.area === a).length;
    if (!n) return '';
    return `<a class="areac" href="#${T()}-places-${A.id}">${pic('f', A.img, A.cap, '', a, true)}<div><small>${esc(A.days || '')}</small><h3>${esc(a)}</h3><p>${n} 個地點${A.cap ? '・' + esc(A.cap) : ''}</p></div></a>`;
  }).join('');
  const photos = tripPhotos(trip.id);
  app.innerHTML = `
  <section class="hero short">
    <div class="bg">${pic('f', SITE.hero.img, trip.name, fit(SITE.hero.pos), SITE.code)}</div>
    <div class="wrap">
      <p class="kicker">${esc(SITE.kicker || '')}${plan ? ' · 規劃中' : ''}</p>
      <h1>${esc(trip.name)}</h1>
      <div class="meta"><span>${esc(D.info.subtitle)}</span>${SITE.route ? `<span>${esc(SITE.route)}</span>` : ''}</div>
      ${D.days.length ? `<div class="acts"><a class="btn" href="#${T()}-day-1">從第一天開始</a>${D.places.length ? `<a class="btn ghost" href="#${T()}-places">景點與店家</a>` : ''}</div>` : ''}
    </div>
  </section>
  ${facts ? `<div class="wrap"><div class="facts">${facts}</div></div>` : ''}
  ${D.days.length ? `<section class="sec"><div class="wrap">
    <div class="sec-h"><p class="kicker">ITINERARY</p><h2>${D.days.length} 天行程</h2><p>${esc(SITE.route || D.info.subtitle)}</p></div>
    <div class="days">${days}</div>
  </div></section>` : `<section class="sec"><div class="wrap"><p class="empty">行程還在規劃中，排好後會在這裡出現每日路線。</p></div></section>`}
  ${allKeys.length ? `<section class="sec band"><div class="wrap">
    <div class="sec-h"><p class="kicker">KEY TIMES</p><h2>全程重要時間</h2><p>全員必須到場的集合、航班與船班。</p></div>
    <div class="anchors">${allKeys.map(k => `<a class="anchor" href="#${T()}-day-${k.day}"><span class="t">${esc(k.time)}</span><span><small>DAY ${k.day}・${keyTag(k)}</small><p>${esc(plain(k.event).replace(/^集合：/, ''))}</p></span></a>`).join('')}</div>
  </div></section>` : ''}
  ${areas ? `<section class="sec"><div class="wrap">
    <div class="sec-h"><p class="kicker">DESTINATIONS</p><h2>景點與店家</h2><p>${D.places.length} 個地點，依區域分類${SITE.placeNote ? '・' + clean(SITE.placeNote) : ''}</p></div>
    <div class="areas">${areas}</div>
    <p style="text-align:center;margin-top:32px"><a class="btn line" href="#${T()}-places">看全部地點</a></p>
  </div></section>` : ''}
  ${info.length ? `<section class="sec" style="background:var(--sand)"><div class="wrap">
    <div class="sec-h"><p class="kicker">GOOD TO KNOW</p><h2>實用資訊</h2></div>
    <div class="acc">${info.map((x, i) => `<details${i === 0 ? ' open' : ''}><summary>${esc(x.k)}</summary><p>${clean(x.v)}</p></details>`).join('')}</div>
  </div></section>` : ''}
  ${photos.length ? `<section class="sec"><div class="wrap">
    <div class="sec-h"><p class="kicker">GALLERY</p><h2>旅途剪影</h2><p>${photos.length} 張照片</p></div>
    ${wall(photos)}
  </div></section>` : ''}
  ${footer()}`;
  heroPage = true;
  paintMenu(trip.id);
}

function renderDay(n){
  const d = D.days.find(x => x.day === n) || D.days[0];
  if (!d) return renderTrip();
  const c = dayCfg(d.day), area = c.area;
  const prev = D.days.find(x => x.day === d.day - 1), next = D.days.find(x => x.day === d.day + 1);
  const cur = SITE.cur || '¥';
  const tabs = D.days.map(x => `<a href="#${T()}-day-${x.day}"${x.day === d.day ? ' aria-current="page"' : ''}><b>DAY ${x.day}</b>${esc(dayCfg(x.day).short || x.date.split(/\s|（|\(/)[0])}</a>`).join('');
  const items = d.items.map(it => {
    const key = it.kind === 'key', move = it.kind === 'move';
    const text = plain(it.event).replace(move ? /^移動\s*/ : /^集合：/, '');
    if (move) return `<li class="move"><span class="t"></span><div class="x">${esc(text)}</div></li>`;
    return `<li class="${key ? 'key' : ''}"><span class="t">${esc(it.time)}${it.until ? `<small>～${esc(it.until)}</small>` : ''}</span>
      <div class="x">${key ? `<span class="tag">${keyTag(it)}</span><br>` : isBooked(it.event) ? '<span class="tag">已訂</span><br>' : ''}${esc(text)}</div></li>`;
  }).join('');
  const legs = d.transfers.map(t => `<div><b>${esc(t.leg)}</b>${t.time || t.cost ? `<span>${esc(t.time || '')}${t.cost ? '　' + cur + Number(t.cost).toLocaleString() : ''}</span>` : ''}<p>${clean(t.way)}</p></div>`).join('');
  const nPlaces = D.places.filter(p => p.area === area).length;
  app.innerHTML = `
  <section class="hero short" style="min-height:clamp(380px,60svh,640px)">
    <div class="bg">${pic('f', c.img, c.cap, fit(c.pos), 'DAY ' + d.day)}</div>
    <div class="wrap">
      <p class="kicker"><a href="#${T()}" style="text-decoration:none">${esc(trip.name)}</a>　·　DAY ${d.day}${area ? '・' + esc(area) : ''}</p>
      <h1 style="font-size:clamp(34px,6.4vw,68px)">${esc(d.title)}</h1>
      <div class="meta"><span>${esc(d.date)}</span>${c.img && c.cap ? `<span>${esc(c.cap)}</span>` : ''}</div>
    </div>
  </section>
  <div class="daytabs"><nav class="wrap" aria-label="切換日期">${tabs}</nav></div>
  <main class="wrap" style="padding-block:clamp(36px,6vw,64px) clamp(56px,8vw,96px)">
    <div class="dlayout">
      <section aria-label="當日行程"><ol class="tl">${items}</ol></section>
      <aside class="side">
        ${(c.must || []).length || (c.tips || []).length || c.foot ? `<div class="box"><h3>今天的重點</h3>
          ${(c.must || []).length ? `<div class="mustl">${c.must.map(([t, x]) => `<div><b>${esc(t)}</b><span>${esc(x)}</span></div>`).join('')}</div>` : ''}
          ${(c.tips || []).length ? `<ul>${c.tips.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
          ${c.foot ? `<p class="foot">${esc(c.foot)}</p>` : ''}</div>` : ''}
        ${legs ? `<div class="box"><h3>怎麼移動</h3><div class="legs">${legs}</div></div>` : ''}
        ${area && nPlaces ? `<a class="areac" style="aspect-ratio:16/10" href="#${T()}-places-${areaCfg(area).id}">${pic('f', areaCfg(area).img, area, '', area, true)}<div><small>${nPlaces} 個地點</small><h3>${esc(area)}的景點與店家</h3><p>${esc(c.hint || '')}</p></div></a>` : ''}
      </aside>
    </div>
    <div class="pager">
      ${prev ? `<a href="#${T()}-day-${prev.day}"><small>← DAY ${prev.day}</small><b>${esc(prev.title)}</b></a>` : ''}
      ${next ? `<a class="next" href="#${T()}-day-${next.day}"><small>DAY ${next.day} →</small><b>${esc(next.title)}</b></a>` : `<a class="next" href="#${T()}"><small>行程結束 →</small><b>回到旅程總覽</b></a>`}
    </div>
  </main>
  ${footer()}`;
  heroPage = true;
  paintMenu(trip.id);
}

let placeFilter = 'all';
function renderPlaces(focus){
  const chips = D.areaOrder.map(a => {
    const n = D.places.filter(p => p.area === a).length;
    return n ? `<a href="#${T()}-places-${areaCfg(a).id}">${esc(a)}<span>${n}</span></a>` : '';
  }).join('');
  const sections = D.areaOrder.map(a => {
    const all = D.places.map((p, i) => ({p, i})).filter(x => x.p.area === a);
    if (!all.length) return '';
    const A = areaCfg(a);
    return `<section class="area" id="${A.id}">
      <div class="area-h">${pic('f', A.img, A.cap, '', '', true)}<div><small>${esc(A.days || '')}${A.cap ? '　' + esc(A.cap) : ''}</small><h2>${esc(a)}<span>${all.length} 個地點</span></h2></div></div>
      <div class="pgrid">${all.map(({p, i}) => `<a class="pc ${p.t === 'eat' ? 'eat' : 'see'}" data-t="${p.t === 'eat' ? 'eat' : 'see'}" href="#${T()}-place-${i}">
        <span class="top"><span class="k">${p.t === 'eat' ? '店家' : '景點'}</span>${p.tag ? `<span class="tg">${esc(p.tag)}</span>` : ''}${p.res ? '<span class="rs">✓ 需預約</span>' : ''}</span>
        <h3>${esc(p.n)}</h3><p>${clean(p.desc)}</p></a>`).join('')}</div>
    </section>`;
  }).join('');
  app.innerHTML = `
  <header class="pagehead wrap">
    <p class="kicker">${esc(trip.name)}</p>
    <h1>景點與店家</h1>
    <p>${D.places.length} 個地點${SITE.placeNote ? '・' + clean(SITE.placeNote) : ''}</p>
    <div class="chips" role="group" aria-label="篩選類型">
      <button type="button" data-f="all">全部</button><button type="button" data-f="see">景點</button><button type="button" data-f="eat">店家</button>
    </div>
    <nav class="chips" aria-label="依區域跳轉" style="margin-top:12px">${chips}</nav>
  </header>
  <main class="wrap" style="padding-bottom:clamp(56px,8vw,96px)">${sections || '<p class="empty" style="margin-top:40px">還沒有加入地點。</p>'}</main>
  ${footer()}`;
  const paintFilter = () => {
    app.querySelectorAll('[data-f]').forEach(b => b.setAttribute('aria-pressed', b.dataset.f === placeFilter));
    app.querySelectorAll('.pc').forEach(el => { el.hidden = placeFilter !== 'all' && el.dataset.t !== placeFilter; });
    app.querySelectorAll('.area').forEach(s => { s.hidden = !s.querySelector('.pc:not([hidden])'); });
  };
  app.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => { placeFilter = b.dataset.f; paintFilter(); }));
  paintFilter();
  heroPage = false;
  paintMenu(trip.id);
  if (focus){ const el = document.getElementById(focus); if (el){ el.hidden = false; el.scrollIntoView(); return true; } }
}

function renderPlace(i){
  const p = D.places[i];
  if (!p) return renderPlaces();
  const mine = PHOTOS.filter(ph => ph.p === p.n && ph.trip === trip.id);
  lbList = mine;
  const same = D.places.map((q, j) => ({q, j})).filter(x => x.q.area === p.area && x.j !== i).slice(0, 12);
  app.innerHTML = `
  <header class="pagehead wrap">
    <p class="kicker"><a href="#${T()}-places-${areaCfg(p.area).id}" style="text-decoration:none">← ${esc(trip.name)}・${esc(p.area)}</a></p>
  </header>
  <main class="wrap" style="padding-bottom:clamp(56px,8vw,96px)">
    <section class="pd">
      <h1 style="font-size:clamp(32px,5.6vw,52px);font-weight:900">${esc(p.n)}</h1>
      <div class="pills"><span>${esc(p.area)}</span><span>${p.t === 'eat' ? '店家' : '景點'}</span>${p.tag ? `<span>${esc(p.tag)}</span>` : ''}${p.res ? '<span class="ok">需預約</span>' : ''}</div>
      <p class="desc">${clean(p.desc)}</p>
      ${p.map ? `<a class="btn" href="${esc(p.map)}" target="_blank" rel="noopener">在 Google 地圖開啟 ↗</a>` : ''}
    </section>
    ${mine.length ? `<div class="pphotos">${mine.map((ph, k) => `<button type="button" data-ph="${k}" aria-label="放大照片：${esc(ph.c)}"><img src="${imgSrc('t', ph.n)}" alt="${esc(ph.c)}" loading="lazy"></button>`).join('')}</div>` : ''}
    ${same.length ? `<section style="margin-top:clamp(48px,7vw,80px)">
      <div class="sec-h" style="margin-bottom:24px"><h2 style="font-size:clamp(22px,3vw,30px)">${esc(p.area)}其他地點</h2></div>
      <div class="pgrid">${same.map(({q, j}) => `<a class="pc ${q.t === 'eat' ? 'eat' : 'see'}" href="#${T()}-place-${j}"><span class="top"><span class="k">${q.t === 'eat' ? '店家' : '景點'}</span>${q.tag ? `<span class="tg">${esc(q.tag)}</span>` : ''}</span><h3>${esc(q.n)}</h3></a>`).join('')}</div>
    </section>` : ''}
  </main>
  ${footer()}`;
  heroPage = false;
  paintMenu(trip.id);
}

// 燈箱
const lb = document.getElementById('lb');
function paintLb(){ const ph = lbList[lbAt]; if (!ph) return; lb.querySelector('img').src = imgSrc('f', ph.n); lb.querySelector('img').alt = ph.c; lb.querySelector('.cap span').textContent = `${ph.c}　${lbAt + 1} / ${lbList.length}`; }
function openLb(k){ lbAt = k; lb.hidden = false; paintLb(); document.addEventListener('keydown', lbKeys); lb.querySelector('[data-lb="x"]').focus(); }
function closeLb(){ lb.hidden = true; document.removeEventListener('keydown', lbKeys); }
function stepLb(n){ if (!lbList.length) return; lbAt = (lbAt + n + lbList.length) % lbList.length; paintLb(); }
function lbKeys(e){ if (e.key === 'Escape') closeLb(); else if (e.key === 'ArrowLeft') stepLb(-1); else if (e.key === 'ArrowRight') stepLb(1); }
lb.addEventListener('click', e => {
  const b = e.target.closest('[data-lb]');
  if (!b){ if (e.target === lb) closeLb(); return; }
  if (b.dataset.lb === 'x') closeLb(); else stepLb(+b.dataset.lb);
});
let touchX = null;
lb.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, {passive:true});
lb.addEventListener('touchend', e => { if (touchX == null) return; const dx = e.changedTouches[0].clientX - touchX; if (Math.abs(dx) > 50) stepLb(dx < 0 ? 1 : -1); touchX = null; });
app.addEventListener('click', e => { const b = e.target.closest('[data-ph]'); if (b) openLb(+b.dataset.ph); });

// 底部分頁列：記住目前看的旅程與天數
let lastTrip = null, lastDay = 1;
function syncTabs(h){
  const m = h.match(/^t-([a-z0-9]+)(?:-(day|places?)-?(\w*))?$/);
  if (m && m[1] !== lastTrip){ lastTrip = m[1]; lastDay = 1; }
  if (m && m[2] === 'day') lastDay = +m[3] || 1;
  if (!lastTrip){ const first = sortedTrips().find(t => t.status !== 'planning') || TRIPS[0]; lastTrip = first && first.id; }
  const tab = !m ? 'home' : m[2] === 'day' ? 'day' : m[2] ? 'places' : 'trip';
  document.querySelectorAll('#tabbar a').forEach(a => {
    if (a.dataset.tab === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  const q = s => document.querySelector(`#tabbar [data-tab="${s}"]`);
  q('trip').href = `#t-${lastTrip}`;
  q('day').href = `#t-${lastTrip}-day-${lastDay}`;
  q('places').href = `#t-${lastTrip}-places`;
  document.getElementById('tab-day').textContent = tab === 'day' ? 'DAY ' + lastDay : '每日';
}

function route(){
  closeLb();
  const h = location.hash.replace('#', '');
  // 首頁內的錨點（#trips）只捲動，不重畫
  if (h === 'trips' && trip === null && app.querySelector('#trips')) return;
  syncTabs(h);
  let m, focused = false;
  if ((m = h.match(/^t-([a-z0-9]+)(.*)$/)) && useTrip(m[1])){
    const rest = m[2]; let r;
    if (!rest) renderTrip();
    else if ((r = rest.match(/^-day-(\d+)$/))) renderDay(+r[1]);
    else if (rest === '-places') renderPlaces();
    else if ((r = rest.match(/^-places-(\w+)$/))) focused = renderPlaces(r[1]);
    else if ((r = rest.match(/^-place-(\d+)$/))) renderPlace(+r[1]);
    else renderTrip();
  } else {
    renderHome();
    if (h === 'trips'){ document.getElementById('trips').scrollIntoView(); focused = true; }
  }
  if (!focused) window.scrollTo(0, 0);
  paintNav();
}
window.addEventListener('hashchange', route);
// 後台預覽用：套用尚未發布的資料並重畫目前頁面
window.TRAVEL = {
  apply(data, overrides){
    load(data);
    window.PHOTO_OVERRIDE = overrides || {};
    const y = window.scrollY; route(); window.scrollTo(0, y);
  },
  go(hash){ if (location.hash === '#' + hash) route(); else location.hash = hash; }
};
route();
</script>
